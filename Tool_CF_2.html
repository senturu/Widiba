:root{--magenta:#D03F65;--blu:#2C2E39;--avorio:#F5F1E9;--avorio2:#EDE7DA;--hair:#E4DCCB;--ink2:#5b5d68;--grigio:#958B87;--pos:#3F7F6F;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--avorio);font-family:'WidibaBook',system-ui,sans-serif;color:var(--blu)}
#splash{position:fixed;inset:0;background:var(--avorio);display:flex;align-items:center;justify-content:center;z-index:999}
.hidden{display:none}
#top{padding:20px 18px 16px;border-bottom:1px solid var(--hair)}
.brandrow{display:flex;align-items:center;gap:10px}
.molla{width:36px;height:18px;flex:0 0 auto}
.logotype{font-family:'WidibaLight',system-ui;letter-spacing:.04em;font-size:16px;color:var(--blu)}
.logotype b{font-family:'WidibaBold',system-ui}
.up{font-family:'WidibaLight',system-ui;text-transform:uppercase;letter-spacing:.15em;font-size:11px;color:var(--ink2);margin-top:2px}
.gearbtn{margin-left:auto;width:38px;height:38px;border-radius:999px;background:var(--avorio2);border:1px solid var(--hair);
  display:grid;place-items:center;color:var(--blu);cursor:pointer}
.wrap{max-width:1100px;margin:0 auto;padding:22px 18px 60px}
.legend{display:flex;gap:18px;flex-wrap:wrap;padding:0 2px 20px;font-size:11.5px;color:var(--ink2)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:14px;height:14px;border-radius:5px;display:inline-block}
.legend i.tool{background:var(--magenta)}
.legend i.conv{background:var(--grigio)}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.toolcard{background:#fff;border:1px solid var(--hair);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px}
.toolmain{display:flex;flex-direction:column;align-items:center;gap:12px;background:none;border:0;cursor:pointer;padding:6px 0}
.toolmain img{width:76px;height:76px;border-radius:18px}
.toolmain.unset img{opacity:.55}
.tname{font-family:'WidibaMedium',system-ui;font-size:14px;color:var(--blu);text-align:center;line-height:1.3}
.convbtn{display:flex;align-items:center;gap:9px;background:var(--avorio2);border:1px dashed var(--hair);border-radius:12px;
  padding:8px 12px;cursor:pointer}
.convbtn.unset{opacity:.55}
.convbtn img{width:28px;height:28px;border-radius:8px;flex:0 0 auto}
.clabel{font-family:'WidibaMedium',system-ui;font-size:11.5px;color:var(--ink2)}
/* sheet impostazioni */
.scrim{position:fixed;inset:0;background:rgba(44,46,57,.42);z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--avorio);border-radius:20px 20px 0 0;
  transform:translateY(100%);transition:transform .26s cubic-bezier(.3,.8,.3,1);max-height:88vh;display:flex;flex-direction:column}
.sheet.show{transform:translateY(0)}
@media (min-width:640px){ .sheet{max-width:640px;margin:0 auto;border-radius:20px 20px 0 0} }
.grab{width:36px;height:4px;background:var(--hair);border-radius:99px;margin:10px auto}
.sheet-h{display:flex;align-items:center;justify-content:space-between;padding:4px 18px 12px;border-bottom:1px solid var(--hair)}
.sheet-h .t{font-family:'WidibaMedium',system-ui;font-size:15px}
.close{background:none;border:0;font-size:22px;color:var(--grigio);cursor:pointer}
.sheet-b{padding:16px 18px;overflow-y:auto}
.sheet-foot{display:flex;gap:10px;padding:12px 18px;border-top:1px solid var(--hair)}
.sheet-foot.hidden{display:none}
.btn{flex:1;border-radius:10px;padding:12px;font-family:'WidibaMedium',system-ui;font-size:13px;cursor:pointer;border:0}
.btn.ghost{background:var(--avorio2);color:var(--blu)}
.btn.primary{background:var(--blu);color:#fff}
.settings-intro{font-size:12px;color:var(--ink2);line-height:1.5;background:var(--avorio2);border-radius:12px;padding:12px;margin-bottom:16px}
.settings-intro code{background:#fff;padding:1px 5px;border-radius:5px}
.settings-group{margin-bottom:16px}
.settings-label{display:flex;align-items:center;gap:8px;font-family:'WidibaMedium',system-ui;font-size:12.5px;margin-bottom:6px}
.settings-label img{width:22px;height:22px;border-radius:6px}
.settings-group input{width:100%;padding:9px 11px;border:1px solid var(--hair);border-radius:9px;font-size:12.5px;
  margin-bottom:6px;font-family:'WidibaBook',system-ui;color:var(--blu)}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--blu);color:#fff;
  padding:11px 20px;border-radius:999px;font-size:12.5px;font-family:'WidibaMedium',system-ui;opacity:0;transition:.25s;pointer-events:none;z-index:80}
#toast.show{opacity:1;transform:translate(-50%,0)}
.importrow{margin-top:6px;padding-top:14px;border-top:1px solid var(--hair)}
</style>

<script>
/* ============ Widiba · Tool CF — hub app ============ */
const APP_VER="1.0";
const TOOLS=[
  {key:"sinottica",   name:"Tabella Sinottica",     hasConverter:true},
  {key:"fondietf",    name:"Analitica Fondi & ETF", hasConverter:true},
  {key:"etcetn",      name:"Analitica ETC - ETN",   hasConverter:true},
  {key:"bond",        name:"Analitica Bond",        hasConverter:true},
  {key:"azioni",      name:"Analitica Azioni",      hasConverter:true},
  {key:"focus",       name:"Strumenti in Focus",    hasConverter:true},
  {key:"portafogli",  name:"Portafogli Modello",    hasConverter:true},
];
const LINKS_FILE="tool_cf_links.json";
let LINKS={};

function esc(s){ return (s==null?"":(""+s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function escq(s){ return (""+s).replace(/'/g,"\\'"); }
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(window._tt); window._tt=setTimeout(()=>t.classList.remove("show"),2600); }

function loadStoredLinks(){
  try{ const raw=localStorage.getItem("tool_cf_links"); return raw?JSON.parse(raw):null; }catch(e){ return null; }
}
function storeLinks(l){ try{ localStorage.setItem("tool_cf_links", JSON.stringify(l)); }catch(e){} }

async function autoLoadLinksFile(silent){
  try{
    const url=new URL(LINKS_FILE, document.baseURI);
    const res=await fetch(url.href,{cache:"no-store"});
    if(!res.ok) return false;
    const j=await res.json();
    if(!j||!j.links) return false;
    LINKS=j.links;
    storeLinks(LINKS);
    if(!silent) toast("Link aggiornati da "+LINKS_FILE);
    return true;
  }catch(e){ return false; }
}

function ensureLinksShape(){
  TOOLS.forEach(t=>{ if(!LINKS[t.key]) LINKS[t.key]={tool:"",converter:""}; });
}

function toolIcon(key,variant){ return `<img src="data:image/png;base64,${ICONS[key+"_"+variant]}" alt="">`; }

function openUrl(url){
  if(!url){ toast("Link non configurato — vai nelle Impostazioni per inserirlo"); return; }
  window.open(url,"_blank","noopener");
}

/* ============ vista principale ============ */
function renderHub(){
  const el=document.getElementById("grid");
  let h="";
  TOOLS.forEach(t=>{
    const links=LINKS[t.key]||{tool:"",converter:""};
    h+=`<div class="toolcard">
      <button class="toolmain ${links.tool?'':'unset'}" onclick="openUrl('${escq(links.tool)}')">
        <span class="ticon">${toolIcon(t.key,"tool")}</span>
        <span class="tname">${esc(t.name)}</span>
      </button>
      ${t.hasConverter?`<button class="convbtn ${links.converter?'':'unset'}" onclick="event.stopPropagation();openUrl('${escq(links.converter)}')" title="Apri il converter dati di ${esc(t.name)}">
        <span class="cicon">${toolIcon(t.key,"converter")}</span>
        <span class="clabel">Converter</span>
      </button>`:""}
    </div>`;
  });
  el.innerHTML=h;
}

/* ============ impostazioni: modifica link, salva su file ============ */
function openSettings(){
  ensureLinksShape();
  let h=`<div class="settings-intro">Inserisci qui gli indirizzi (URL) di ciascun tool e del relativo converter. Al salvataggio verranno applicati subito e scaricherai un file <code>${LINKS_FILE}</code> da tenere nella stessa cartella di questa pagina: al prossimo avvio, ovunque sia aperta (anche in locale), i link verranno letti automaticamente da lì.</div>`;
  TOOLS.forEach(t=>{
    const l=LINKS[t.key]||{tool:"",converter:""};
    h+=`<div class="settings-group">
      <div class="settings-label">${toolIcon(t.key,"tool")} ${esc(t.name)}</div>
      <input type="url" placeholder="URL del tool" value="${esc(l.tool)}" id="in_${t.key}_tool">
      ${t.hasConverter?`<input type="url" placeholder="URL del converter" value="${esc(l.converter)}" id="in_${t.key}_converter">`:""}
    </div>`;
  });
  const foot=`<button class="btn ghost" onclick="closeSheet()">Annulla</button>
    <button class="btn primary" onclick="saveSettings()">Salva e scarica ${LINKS_FILE}</button>`;
  h+=`<div class="importrow"><div class="settings-label">Oppure carica un file <code>${LINKS_FILE}</code> già pronto</div>
    <input type="file" id="linksFilePick" accept=".json" style="display:none" onchange="onPickLinksFile(this)">
    <button class="btn ghost" style="width:100%" onclick="document.getElementById('linksFilePick').click()">Scegli file</button></div>`;
  openSheet("Impostazioni · Link dei tool",`<div class="settings-wrap">${h}</div>`,foot);
}
function saveSettings(){
  TOOLS.forEach(t=>{
    const toolEl=document.getElementById("in_"+t.key+"_tool");
    const convEl=document.getElementById("in_"+t.key+"_converter");
    LINKS[t.key]={ tool: toolEl?toolEl.value.trim():"", converter: convEl?convEl.value.trim():"" };
  });
  storeLinks(LINKS);
  renderHub();
  downloadLinksFile();
  closeSheet();
  toast("Link salvati e file scaricato");
}
function downloadLinksFile(){
  const payload={ generato: new Date().toISOString().slice(0,10), links: LINKS };
  const js=JSON.stringify(payload,null,2);
  const blob=new Blob([js],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=LINKS_FILE;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),3000);
}
async function onPickLinksFile(input){
  const file=input.files[0]; if(!file) return;
  try{
    const j=JSON.parse(await file.text());
    if(!j.links) throw new Error("formato non valido");
    LINKS=j.links; ensureLinksShape(); storeLinks(LINKS); renderHub();
    toast("Link caricati da file");
  }catch(e){ toast("File non leggibile: "+((e&&e.message)||e)); }
}

/* ============ sheet generico minimale ============ */
function openSheet(title,body,foot){
  document.getElementById("sheetT").textContent=title;
  document.getElementById("sheetB").innerHTML=body;
  const f=document.getElementById("sheetF"); f.innerHTML=foot||""; f.classList.toggle("hidden",!foot);
  document.getElementById("scrim").classList.add("show");
  document.getElementById("sheet").classList.add("show");
}
function closeSheet(){
  document.getElementById("scrim").classList.remove("show");
  document.getElementById("sheet").classList.remove("show");
}

/* ============ avvio ============ */
window.addEventListener("load",async ()=>{
  const stored=loadStoredLinks();
  LINKS=stored||{};
  ensureLinksShape();
  renderHub();
  document.getElementById("splash").style.display="none";
  document.getElementById("app").classList.remove("hidden");
  const found=await autoLoadLinksFile(true);
  if(found) renderHub();
});

</script>
</body>
