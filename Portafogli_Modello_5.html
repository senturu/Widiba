:root{
  --magenta:#D03F65; --blu:#2C2E39; --avorio:#F5F1E9;
  --avorio2:#EFE9DA; --avorioDark:#E7E0D2;
  --grigio:#958B87; --hair:#D9CFC0;
  --pos:#3F7F6F;  --neg:#A4475F;       /* delta semantici, tonalità di brand */
  --azionario:#6C6F91; --obbligazionario:#6F8587; --bilanciato:#91805D;
  --flessibile:#7C6272; --liquidita:#5E8A8C; --altro:#958B87;
  --f1:#A5BDBF;--f2:#B9A884;--f3:#D5C39E;--f4:#C58A7E;--f5:#C05E72;
  --ink:#2C2E39; --ink2:#5b5d68; --white:#fff;
  --tLight:'WidibaLight',system-ui,sans-serif;
  --tBook:'WidibaBook',system-ui,sans-serif;
  --tMed:'WidibaMedium',system-ui,sans-serif;
  --tBold:'WidibaBold',system-ui,sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--avorio);color:var(--ink);font-family:var(--tBook);font-size:15px;line-height:1.45;
  overscroll-behavior:none;-webkit-font-smoothing:antialiased}
.up{font-family:var(--tLight);text-transform:uppercase;letter-spacing:.15em}
button{font-family:var(--tBook);cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:var(--tBook)}
::-webkit-scrollbar{width:0;height:0}

/* ===== Top bar ===== */
#top{position:sticky;top:0;z-index:40;background:var(--avorio);
  border-bottom:1px solid var(--hair);padding:10px 14px 8px;}
.brandrow{display:flex;align-items:center;gap:10px}
.molla{width:34px;height:17px;flex:0 0 auto}
.logotype{font-family:var(--tLight);letter-spacing:.04em;font-size:15px;color:var(--blu)}
.logotype b{font-family:var(--tBold)}
.verpill{margin-left:auto;display:flex;align-items:center;gap:6px;background:var(--blu);color:var(--avorio);
  border-radius:999px;padding:5px 11px;font-family:var(--tMed);font-size:11px;letter-spacing:.02em}
.verpill .dot{width:6px;height:6px;border-radius:50%;background:#7FBF8F}
.verpill.off .dot{background:#C58A7E}
.hairline{height:1px;background:var(--magenta);width:34px;margin:7px 0 0 0;border:0}

/* ===== Search ===== */
.searchwrap{display:flex;gap:8px;align-items:center;margin-top:9px}
.search{flex:1;display:flex;align-items:center;gap:8px;background:var(--white);border:1px solid var(--hair);
  border-radius:12px;padding:9px 12px}
.search input{border:none;outline:none;background:none;flex:1;font-size:15px;color:var(--ink)}
.search svg{flex:0 0 auto;opacity:.55}
.iconbtn{width:40px;height:40px;border-radius:12px;background:var(--white);border:1px solid var(--hair);
  display:grid;place-items:center;position:relative}
.iconbtn .bdg{position:absolute;top:-5px;right:-5px;background:var(--magenta);color:#fff;font-family:var(--tMed);
  font-size:10px;min-width:17px;height:17px;border-radius:9px;display:grid;place-items:center;padding:0 4px}

/* quick chips */
.chips{display:flex;gap:7px;overflow-x:auto;padding:9px 0 1px;margin:0 -2px}
.chip{flex:0 0 auto;border:1px solid var(--hair);background:var(--white);border-radius:999px;padding:6px 12px;
  font-size:12.5px;color:var(--ink2);white-space:nowrap;font-family:var(--tMed)}
.chip.on{background:var(--blu);color:var(--avorio);border-color:var(--blu)}
.chip.cnt{display:flex;gap:6px;align-items:center}
.chip .x{opacity:.7;font-family:var(--tBook)}

/* ===== Results meta ===== */
.meta{display:flex;align-items:center;gap:8px;padding:10px 14px 4px;font-size:12.5px;color:var(--ink2)}
.meta b{font-family:var(--tMed);color:var(--ink)}
.sortbtn{margin-left:auto;display:flex;align-items:center;gap:6px;font-family:var(--tMed);color:var(--ink)}
/* ---- foglio ordinamento multi-criterio ---- */
.msort-list{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.msort-row{display:flex;align-items:center;gap:6px;background:var(--avorio);border:1px solid var(--hair);border-radius:10px;padding:6px 8px}
.msort-pri{flex:0 0 auto;width:20px;height:20px;border-radius:50%;background:var(--magenta);color:#fff;font-family:var(--tMed);font-size:11px;display:flex;align-items:center;justify-content:center}
.msort-lab{flex:1 1 auto;font-size:12.5px;font-family:var(--tMed);color:var(--ink);line-height:1.15;min-width:0}
.msort-dir{flex:0 0 auto;font-size:11px;font-family:var(--tMed);padding:4px 7px;border-radius:7px;border:1px solid var(--hair);background:#fff;color:var(--ink);white-space:nowrap}
.msort-dir.desc{border-color:var(--magenta);color:var(--magenta)}
.msort-mv{flex:0 0 auto;width:22px;height:24px;border-radius:6px;border:1px solid var(--hair);background:#fff;color:var(--ink2);font-size:10px}
.msort-mv:disabled{opacity:.3}
.msort-rm{flex:0 0 auto;width:24px;height:24px;border-radius:6px;border:1px solid var(--hair);background:#fff;color:var(--neg);font-size:16px;line-height:1}
.msort-addh{font-family:var(--tLight);text-transform:uppercase;letter-spacing:.12em;font-size:10px;color:var(--ink2);margin:4px 0 8px}
.msort-add{display:flex;flex-direction:column;gap:4px}
.msort-opt{width:100%;text-align:left}
.msort-reset{margin-top:14px;width:100%;padding:9px;border-radius:9px;border:1px solid var(--hair);background:#fff;font-family:var(--tMed);font-size:12.5px;color:var(--ink)}

/* ===== List ===== */
#list{padding:6px 12px 10px}
.card{background:var(--white);border:1px solid var(--hair);border-radius:16px;padding:12px 13px;margin:8px 0;
  display:flex;gap:11px;align-items:flex-start;position:relative;transition:border-color .12s}
.card.sel{border-color:var(--magenta);box-shadow:0 0 0 1px var(--magenta) inset}
.acc{width:4px;align-self:stretch;border-radius:3px;flex:0 0 auto}
.acc.etf{width:0;border-left:4px dashed;border-radius:0;background:none!important}
.badgePlus{display:inline-flex;align-items:center;gap:3px;background:linear-gradient(135deg,var(--magenta),#B8335A);
  color:#fff;font-family:var(--tMed);font-size:9.5px;letter-spacing:.04em;padding:2px 7px 2px 6px;border-radius:999px;
  margin-bottom:4px;box-shadow:0 1px 3px rgba(208,63,101,.35)}
.card .body{flex:1;min-width:0}
.cname{font-family:var(--tMed);font-size:14.5px;color:var(--blu);line-height:1.25;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.csub{font-size:11.5px;color:var(--ink2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow{display:flex;gap:6px;align-items:center;margin-top:8px;flex-wrap:wrap}
.tag{font-size:10.5px;font-family:var(--tMed);padding:3px 7px;border-radius:6px;background:var(--avorio2);color:var(--ink2);
  letter-spacing:.02em;white-space:nowrap}
.tag.cat{color:#fff}
.tag.risk{color:#fff}
.kv{display:flex;flex-direction:column;align-items:flex-end;gap:1px;min-width:62px}
.kv .k{font-size:9.5px;color:var(--ink2);letter-spacing:.05em;text-transform:uppercase;font-family:var(--tLight)}
.kv .val{font-family:var(--tMed);font-size:15px}
.kv .val.num{font-variant-numeric:tabular-nums}
.pos{color:var(--pos)} .neg{color:var(--neg)}
.metrics{display:flex;flex-wrap:wrap;gap:14px;row-gap:8px;margin-top:9px;border-top:1px solid var(--avorio2);padding-top:8px}
.kv.sortkv{position:relative}
.kv.sortkv .k{color:var(--magenta);font-family:var(--tMed)}
.kv.sortkv::before{content:"";position:absolute;top:-8px;right:0;left:0;height:2px;background:var(--magenta);border-radius:2px;opacity:.75}
.cardActions{position:absolute;top:10px;right:10px;display:flex;flex-direction:column;gap:6px;align-items:center}
.selbtn{width:24px;height:24px;border-radius:7px;border:1.5px solid var(--hair);
  display:grid;place-items:center;background:#fff;padding:0;line-height:0}
.selbtn svg{display:block}
.selbtn.on{background:var(--magenta);border-color:var(--magenta)}
.favbtn{width:24px;height:24px;border-radius:7px;border:1.5px solid var(--hair);
  display:grid;place-items:center;background:#fff;padding:0;line-height:0}
.favbtn svg{display:block}
.favbtn.on{background:var(--magenta);border-color:var(--magenta)}
.stars{font-size:12px;letter-spacing:1px;color:var(--bilanciato)}
.loadmore{display:block;width:100%;text-align:center;padding:13px;color:var(--magenta);font-family:var(--tMed);
  background:none;border:1px dashed var(--hair);border-radius:12px;margin:6px 0 2px}
.empty{text-align:center;color:var(--ink2);padding:50px 20px}
.empty .molla{width:54px;height:27px;margin:0 auto 14px;opacity:.5}

/* ===== Bottom nav ===== */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:45;background:var(--avorio);border-top:1px solid var(--hair);
  display:flex;padding:6px 6px calc(6px + var(--safe-b));}
.nav-i{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;color:var(--ink2);position:relative}
.nav-i.on{color:var(--magenta)}
.nav-i .lab{font-size:10px;letter-spacing:.06em;text-transform:uppercase;font-family:var(--tMed)}
.nav-i .bdg{position:absolute;top:2px;right:50%;transform:translateX(16px);background:var(--magenta);color:#fff;
  font-size:9px;min-width:15px;height:15px;border-radius:8px;display:grid;place-items:center;font-family:var(--tMed)}
#scroll{padding-bottom:74px}

/* ===== Sheets / overlays ===== */
.scrim{position:fixed;inset:0;background:rgba(44,46,57,.42);z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--avorio);border-radius:20px 20px 0 0;
  transform:translateY(100%);transition:transform .26s cubic-bezier(.3,.8,.3,1);max-height:92vh;display:flex;flex-direction:column}
.sheet.show{transform:translateY(0)}
.sheet.full{top:0;border-radius:0;max-height:100vh}
.grab{width:38px;height:4px;background:var(--hair);border-radius:2px;margin:9px auto 4px}
.sheet-h{display:flex;align-items:center;gap:10px;padding:6px 16px 12px;border-bottom:1px solid var(--hair)}
.sheet-h .t{font-family:var(--tLight);text-transform:uppercase;letter-spacing:.13em;font-size:14px;color:var(--blu)}
.sheet-h .close{margin-left:auto;font-size:22px;color:var(--ink2);width:34px;height:34px;display:grid;place-items:center}
.sheet-b{overflow-y:auto;padding:14px 16px calc(20px + var(--safe-b));-webkit-overflow-scrolling:touch}

/* filter controls */
.fg{margin:0 0 18px}
.fg>.lab{font-family:var(--tMed);font-size:12px;letter-spacing:.04em;color:var(--ink2);text-transform:uppercase;
  display:flex;align-items:center;gap:8px;margin-bottom:9px}
.fg>.lab:before{content:"";width:14px;height:1px;background:var(--magenta)}
.opts{display:flex;flex-wrap:wrap;gap:7px}
.opt{border:1px solid var(--hair);background:var(--white);border-radius:9px;padding:7px 11px;font-size:13px;color:var(--ink2)}
.opt.on{background:var(--blu);color:var(--avorio);border-color:var(--blu)}
.rangewrap{background:var(--white);border:1px solid var(--hair);border-radius:12px;padding:12px 13px}
.rangewrap .rv{display:flex;justify-content:space-between;font-family:var(--tMed);font-size:13px;margin-bottom:6px}
.dual{position:relative;height:30px}
.dual input[type=range]{position:absolute;width:100%;top:10px;margin:0;-webkit-appearance:none;background:none;pointer-events:none}
.dual input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;
  background:var(--magenta);border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.25);pointer-events:auto}
.dual .track{position:absolute;left:0;right:0;top:13px;height:4px;background:var(--avorioDark);border-radius:2px}
.dual .fill{position:absolute;top:13px;height:4px;background:var(--magenta);border-radius:2px}
.casa-search{width:100%;border:1px solid var(--hair);border-radius:10px;padding:9px 11px;font-size:13px;margin-bottom:8px;background:#fff}
.casalist{max-height:190px;overflow-y:auto;display:flex;flex-direction:column;gap:1px}
.casalist .opt{text-align:left;border-radius:8px;display:flex;justify-content:space-between}
.casalist .opt .c{opacity:.6;font-size:11px}
.sheet-foot{border-top:1px solid var(--hair);padding:11px 16px calc(11px + var(--safe-b));display:flex;gap:10px;background:var(--avorio)}
.btn{flex:1;border-radius:12px;padding:13px;font-family:var(--tMed);font-size:14px;text-align:center}
.btn.primary{background:var(--magenta);color:#fff}
.btn.ghost{background:none;border:1px solid var(--blu);color:var(--blu)}
.btn.dark{background:var(--blu);color:var(--avorio)}
.btn:disabled{opacity:.4}

/* detail */
.dt-head{padding:4px 0 2px}
.dt-name{font-family:var(--tMed);font-size:18px;color:var(--blu);line-height:1.25}
.dt-isin{font-variant-numeric:tabular-nums;font-size:12px;color:var(--ink2);letter-spacing:.06em;margin-top:3px}
.dt-tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}
.block{margin-top:18px}
.block>.bh{font-family:var(--tLight);text-transform:uppercase;letter-spacing:.12em;font-size:12px;color:var(--magenta);
  margin-bottom:9px;display:flex;align-items:center;gap:8px}
.block>.bh:before{content:"";width:16px;height:1px;background:var(--magenta)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--hair);border:1px solid var(--hair);border-radius:12px;overflow:hidden}
.cell{background:var(--white);padding:10px 11px}
.cell .k{font-size:10.5px;color:var(--ink2);text-transform:uppercase;letter-spacing:.04em;font-family:var(--tLight)}
.cell .v{font-family:var(--tMed);font-size:15px;margin-top:2px;font-variant-numeric:tabular-nums}
.perfbars{display:flex;flex-direction:column;gap:7px;background:#fff;border:1px solid var(--hair);border-radius:12px;padding:12px}
.pb{display:grid;grid-template-columns:34px 1fr 58px;align-items:center;gap:9px}
.pb .pl{font-size:11px;color:var(--ink2);font-family:var(--tMed)}
.pb .bar{height:8px;background:var(--avorio2);border-radius:4px;position:relative;overflow:hidden}
.pb .bar i{position:absolute;top:0;bottom:0;left:50%;border-radius:4px}
.pb .pv{text-align:right;font-family:var(--tMed);font-size:13px;font-variant-numeric:tabular-nums}
.kidlink{display:flex;align-items:center;gap:9px;background:#fff;border:1px solid var(--hair);border-radius:12px;
  padding:13px;color:var(--blu);font-family:var(--tMed);margin-top:10px}
.kidlink .ico{color:var(--magenta)}
.pb.rank{grid-template-columns:150px 1fr 38px}
.ranknotch{display:flex;gap:2px;height:8px}
.ranknotch i{flex:1;border-radius:2px;display:block}

/* compare */
.cmp-scroll{overflow-x:auto;border:1px solid var(--hair);border-radius:12px;background:#fff}
table.cmp{border-collapse:collapse;width:max-content;min-width:100%;font-variant-numeric:tabular-nums}
table.cmp th,table.cmp td{padding:9px 11px;font-size:12.5px;text-align:right;border-bottom:1px solid var(--avorio2);white-space:nowrap}
table.cmp th.rowlab,table.cmp td.rowlab{text-align:left;position:sticky;left:0;background:#fff;font-family:var(--tMed);
  color:var(--ink2);font-size:11px;text-transform:uppercase;letter-spacing:.03em;border-right:1px solid var(--hair);z-index:1}
table.cmp thead th{position:sticky;top:0;background:var(--avorio2);font-family:var(--tMed);color:var(--blu);font-size:11.5px}
table.cmp thead th.rowlab{background:var(--avorio2);z-index:2}
table.cmp td.best{color:var(--pos);font-family:var(--tBold)}
table.cmp td.worst{color:var(--neg)}
.cmp-name{max-width:120px;white-space:normal;font-family:var(--tMed);color:var(--blu);font-size:11px;line-height:1.2;text-align:left}

/* report */
.stat{background:#fff;border:1px solid var(--hair);border-radius:14px;padding:13px;margin-bottom:9px}
.stat .sl{font-size:11px;color:var(--ink2);text-transform:uppercase;letter-spacing:.05em;font-family:var(--tLight)}
.stat .sv{font-family:var(--tMed);font-size:24px;color:var(--blu);font-variant-numeric:tabular-nums;margin-top:3px}
.stat .sv small{font-size:13px;color:var(--ink2)}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.dualrow{display:flex;gap:14px;margin-top:3px}
.dualrow>div{flex:1;min-width:0}
.dualrow .sv{font-size:19px}
.dualrow .dlbl{font-size:9.5px;color:var(--ink2);text-transform:uppercase;letter-spacing:.05em;margin-top:1px}
.dist{background:#fff;border:1px solid var(--hair);border-radius:14px;padding:14px;margin-bottom:9px}
.distrow{display:grid;grid-template-columns:96px 1fr 34px;align-items:center;gap:9px;margin:7px 0}
.distrow .dl{font-size:11.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.distrow .db{height:14px;border-radius:4px;background:var(--avorio2);overflow:hidden}
.distrow .db i{display:block;height:100%;border-radius:4px}
.distrow .dn{text-align:right;font-family:var(--tMed);font-size:12px}
.scatter{background:#fff;border:1px solid var(--hair);border-radius:14px;padding:6px;margin-bottom:9px}
.grp-toggle{display:flex;background:var(--avorio2);border-radius:10px;padding:3px;margin-bottom:12px}
.grp-toggle button{flex:1;padding:9px;border-radius:8px;font-family:var(--tMed);font-size:13px;color:var(--ink2)}
.grp-toggle button.on{background:#fff;color:var(--blu);box-shadow:0 1px 3px rgba(0,0,0,.08)}

/* settings */
.set-row{background:#fff;border:1px solid var(--hair);border-radius:12px;padding:13px;margin-bottom:9px}
.set-row .sh{font-family:var(--tMed);font-size:13.5px;color:var(--blu);margin-bottom:3px}
.set-row .sd{font-size:12px;color:var(--ink2);line-height:1.4}
.set-row input[type=url]{width:100%;border:1px solid var(--hair);border-radius:9px;padding:9px 11px;font-size:13px;margin-top:8px;background:var(--avorio)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:var(--blu);color:var(--avorio);
  padding:11px 17px;border-radius:12px;font-size:13px;font-family:var(--tMed);z-index:90;opacity:0;transition:.25s;max-width:88vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.hidden{display:none!important}
.tiny{font-size:11px;color:var(--ink2)}
.cmp-pick{display:flex;align-items:center;gap:9px;background:#fff;border:1px solid var(--hair);border-radius:10px;padding:9px 11px;margin:6px 0}
.cmp-pick .gA{color:var(--azionario)} .cmp-pick .gB{color:var(--flessibile)}
.segbtn{border:1px solid var(--hair);border-radius:8px;padding:5px 10px;font-size:12px;font-family:var(--tMed)}
.segbtn.A{background:var(--azionario);color:#fff;border-color:var(--azionario)}
.segbtn.B{background:var(--flessibile);color:#fff;border-color:var(--flessibile)}
#splash{position:fixed;inset:0;background:var(--avorio);z-index:100;display:grid;place-items:center;transition:opacity .4s}
#splash .molla{width:64px;height:32px;margin:0 auto}
#splash .ld{margin-top:14px;font-family:var(--tLight);text-transform:uppercase;letter-spacing:.18em;font-size:11px;color:var(--ink2);text-align:center}

/* ===== v2.03 additions ===== */
.appver{font-family:var(--tMed);font-size:9.5px;letter-spacing:.06em;color:var(--grigio);
  border:1px solid var(--hair);border-radius:6px;padding:2px 6px;line-height:1;align-self:center}
.fsec{font-family:var(--tLight);text-transform:uppercase;letter-spacing:.16em;font-size:11px;color:var(--blu);
  margin:4px 0 14px;padding-bottom:7px;border-bottom:1px solid var(--magenta)}
.ndnote{background:#fff;border:1px dashed var(--hair);border-radius:12px;padding:11px 12px;font-size:11.5px;color:var(--ink2);line-height:1.45}
.ndnote b{font-family:var(--tMed);color:var(--blu)}
.ndline{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px;flex-wrap:wrap}
.ndchk{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink2);font-family:var(--tMed)}
.ndchk input{width:15px;height:15px;accent-color:var(--magenta)}
.isinpill{display:inline-flex;align-items:center;gap:5px;background:var(--avorio2);border:1px solid var(--hair);
  border-radius:7px;padding:3px 7px;margin-top:6px;cursor:pointer;max-width:100%}
.isinpill .ic{font-variant-numeric:tabular-nums;font-family:var(--tMed);font-size:11px;letter-spacing:.04em;color:var(--blu);white-space:nowrap}
.isinpill svg{flex:0 0 auto;color:var(--magenta);opacity:.85}
.isinpill:active{background:var(--avorioDark)}
.idrow{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.idrow .isinpill{margin-top:6px}
.statusb{display:inline-flex;align-items:center;font-family:var(--tMed);font-size:9.5px;letter-spacing:.02em;
  padding:2.5px 8px;border-radius:999px;border-width:1.4px;border-style:solid;background:none;white-space:nowrap;margin-top:6px}
.cmp-x{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:6px;border:1px solid var(--hair);
  background:#fff;color:var(--neg);padding:0;line-height:0;margin-top:5px}
.cmp-x svg{display:block}
.cmp-isin{font-variant-numeric:tabular-nums;font-size:9.5px;letter-spacing:.03em;color:var(--ink2);margin-top:3px;cursor:pointer}
.wbox{background:var(--white);border:1px solid var(--hair);border-radius:14px;padding:12px 13px;margin-bottom:10px}
.wrow{display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px solid var(--avorio2)}
.wrow:last-child{border-bottom:0}
.wrow .wn{flex:1;min-width:0}
.wrow .wn .nm{font-family:var(--tMed);font-size:12.5px;color:var(--blu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.winp{width:64px;border:1px solid var(--hair);border-radius:8px;padding:7px 8px;font-size:13px;text-align:right;
  font-variant-numeric:tabular-nums;background:var(--avorio);font-family:var(--tMed)}
.wsum{display:flex;justify-content:space-between;align-items:center;margin-top:9px;font-size:12px;color:var(--ink2)}
.wsum b{font-family:var(--tMed);color:var(--blu)}
.wsum.warn b{color:var(--neg)}
.notebox{background:var(--avorio2);border-left:3px solid var(--magenta);border-radius:0 10px 10px 0;
  padding:11px 13px;font-size:12px;color:var(--ink2);line-height:1.5;margin:2px 0 14px}
.notebox b{font-family:var(--tMed);color:var(--blu)}
.segx{display:flex;gap:6px;margin:2px 0 10px}
.segx button{flex:1;border:1px solid var(--hair);background:#fff;border-radius:9px;padding:8px;font-size:12px;font-family:var(--tMed);color:var(--ink2)}
.segx button.on{background:var(--blu);color:var(--avorio);border-color:var(--blu)}
.disclaimer{background:var(--avorio2);border:1px solid var(--hair);border-top:3px solid var(--magenta);
  border-radius:4px 4px 10px 10px;padding:14px 15px;margin:18px 0 4px}
.disclaimer .dc-t{font-family:var(--tLight);text-transform:uppercase;letter-spacing:.15em;font-size:11px;
  color:var(--magenta);margin-bottom:9px}
.disclaimer p{font-size:10.5px;line-height:1.55;color:var(--ink2);text-align:justify;margin:0 0 7px}
.disclaimer p:last-child{margin-bottom:0}
@media print{.disclaimer{break-inside:avoid;background:#f5f1e9!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}}
/* ===== Stampa / Salva PDF: nascondi la UI dell'app (altrimenti la barra di navigazione
   fissa in basso si sovrappone al contenuto di ogni pagina stampata, coprendo tra l'altro
   il disclaimer finale) e lascia scorrere solo il contenuto del report ===== */
@media print{
  #top,#nav,.scrim,.sheet,.toast,#splash,.no-print{display:none!important}
  html,body{height:auto!important;background:#fff!important}
  #scroll{padding-bottom:0!important}
  .stat,.wbox,.dist,.notebox,.footdisc{break-inside:avoid}
  a[href]:after{content:""!important}
}

/* ============ Portafogli Modello — stile dedicato ============ */
.ico{vertical-align:-0.15em;flex:0 0 auto}
.brandtext{display:flex;flex-direction:column;gap:1px}
.infobtn{margin-left:auto;width:34px;height:34px;border-radius:999px;background:var(--avorio2);border:1px solid var(--hair);
  display:grid;place-items:center;color:var(--blu);cursor:pointer}

/* ---- riusate da Strumenti in Focus (stessa suite, stesso linguaggio visivo) ---- */
.loadingline{display:flex;align-items:center;gap:9px;padding:20px 4px;color:var(--grigio);font-size:12.5px}
.spinner{width:15px;height:15px;border-radius:999px;border:2px solid var(--hair);border-top-color:var(--magenta);animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.found-banner{background:rgba(63,127,111,.10);color:var(--pos);font-family:var(--tMed);font-size:12px;padding:9px 12px;border-radius:10px;margin-bottom:12px}
.notfound-banner{background:var(--avorio2);color:var(--ink2,#5b5d68);font-size:12px;line-height:1.5;padding:12px;border-radius:10px}
.legend-wrap{padding-bottom:6px}
.legend-note{background:var(--avorio2);border-radius:12px;padding:13px;font-size:12px;line-height:1.5;color:var(--blu);margin-bottom:16px}
.legend-title{font-family:var(--tLight);text-transform:uppercase;letter-spacing:.13em;font-size:11px;color:var(--magenta);margin-bottom:8px}
.legend-text p{font-size:12px;line-height:1.55;color:var(--ink2,#5b5d68);margin:0 0 10px}
.empty{text-align:center;padding:60px 30px}
.empty-ic{font-size:34px;margin-bottom:12px}
.empty-t{font-family:var(--tMed);font-size:14px;color:var(--blu);margin-bottom:6px}
.empty-s{font-size:12px;color:var(--grigio);line-height:1.5}
#bottomnav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--hair);
  display:flex;padding:8px 10px calc(8px + env(safe-area-inset-bottom));z-index:20}
.navbtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;
  color:var(--grigio);cursor:pointer;position:relative;padding:4px}
.navbtn.on{color:var(--magenta)}
.navic{position:relative;display:inline-flex}
.navbdg{position:absolute;top:-6px;right:-9px;background:var(--magenta);color:#fff;font-size:9px;font-family:var(--tMed);
  min-width:15px;height:15px;border-radius:999px;display:grid;place-items:center;padding:0 3px}
#app{padding-bottom:70px}
.view.hidden{display:none}
.alertbox{background:rgba(164,71,95,.10);color:var(--neg);font-size:12px;line-height:1.5;padding:12px 14px;border-radius:10px;
  border:1px solid rgba(164,71,95,.25)}

/* ---- hero home ---- */
.plainhead{padding:18px 16px 14px;border-bottom:1px solid var(--hair)}
.plainhead-title{font-family:var(--tMed);font-size:19px;color:var(--blu);margin:0 0 5px}
.plainhead-sub{font-family:var(--tBook);font-size:12.5px;color:var(--grigio);line-height:1.5;max-width:520px}
.pickrow-label{font-family:var(--tLight);text-transform:uppercase;letter-spacing:.14em;font-size:11px;color:var(--magenta);padding:20px 16px 10px}
.pickrow-label.first{padding-top:22px}

/* ---- selettore profilo di rischio ---- */
.proflist{padding:0 16px 24px;display:flex;flex-direction:column;gap:10px}
.profcard{background:#fff;border:1px solid var(--hair);border-radius:16px;padding:14px 16px;text-align:left;cursor:pointer;
  display:flex;flex-direction:column;gap:8px}
.profcard-top{display:flex;align-items:baseline;gap:9px}
.profcode{font-family:var(--tBold);font-size:14px;color:var(--magenta);letter-spacing:.02em}
.profcode.sm{font-size:12px}
.proflabel{font-family:var(--tMed);font-size:13.5px;color:var(--blu)}
.riskgauge{height:7px;border-radius:999px;background:var(--avorio2);overflow:hidden;display:flex}
.riskgauge-seg{height:100%}
.profcard-bottom{display:flex;justify-content:space-between}

/* ---- selezione banca ---- */
.subheader{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--hair);flex-wrap:wrap}
.backbtn{display:flex;align-items:center;gap:5px;background:var(--avorio2);border:0;border-radius:999px;
  padding:7px 13px;font-family:var(--tMed);font-size:11.5px;color:var(--blu);cursor:pointer}
.subheader-title{font-family:var(--tMed);font-size:14px;color:var(--blu);display:flex;align-items:center;gap:8px}
.subheader-title img{height:20px;width:auto;flex:0 0 auto}
.bankgrid{padding:18px 16px;display:flex;flex-direction:column;gap:14px}
.bankcard{background:#fff;border:1px solid var(--hair);border-radius:18px;padding:22px 20px;text-align:center;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:10px}
.bankcard-logo{height:56px;display:flex;align-items:center;justify-content:center}
.bankcard-logo img{max-height:100%;max-width:220px;width:auto;object-fit:contain}
.bankcard-name{font-family:var(--tMed);font-size:15px;color:var(--blu)}
.bankcard-stats{display:flex;gap:6px;color:var(--grigio)}
.bankcard-cta{display:flex;align-items:center;gap:5px;font-family:var(--tMed);font-size:12px;color:var(--magenta);margin-top:4px}

/* ---- allocazione (barra segmentata) ---- */
.allocbar{display:flex;height:16px;border-radius:8px;overflow:hidden;margin:16px 16px 10px;background:var(--avorio2)}
.allocbar.sm{height:11px;margin:0}
.allocseg{height:100%}
.alloclegend{display:flex;flex-wrap:wrap;gap:10px 16px;padding:0 16px 16px}
.alloclegend-item{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--blu)}
.alloclegend-item i{width:9px;height:9px;border-radius:3px;flex:0 0 auto}
.cmp-alloc-row{margin-bottom:14px}
.cmp-alloc-label{font-family:var(--tMed);font-size:11.5px;color:var(--blu);margin-bottom:6px}

/* ---- pulsante aggiungi al confronto ---- */
.cmpaddbtn{display:block;width:calc(100% - 32px);margin:4px 16px 18px;background:var(--blu);color:#fff;border:0;
  border-radius:12px;padding:13px;font-family:var(--tMed);font-size:13px;cursor:pointer}
.cmpaddbtn.on{background:var(--pos)}

/* ---- lista strumenti portafoglio ---- */
.instr-group-h{font-family:var(--tLight);text-transform:uppercase;letter-spacing:.1em;font-size:11px;color:var(--magenta);padding:0 16px 8px}
.pinstr-row{display:flex;align-items:center;gap:11px;background:#fff;border-bottom:1px solid var(--avorio2);
  padding:12px 16px;cursor:pointer}
.pinstr-catdot{width:8px;height:8px;border-radius:999px;flex:0 0 auto}
.pinstr-main{flex:1;min-width:0}
.pinstr-name{font-family:var(--tMed);font-size:12.5px;color:var(--blu);line-height:1.35}
.pinstr-sub{font-size:10.5px;color:var(--grigio);margin-top:2px}
.pinstr-w{font-family:var(--tBold);font-size:13px;color:var(--blu);flex:0 0 auto}

/* ---- dettaglio strumento ---- */
.instr-detail-h{padding-bottom:14px;border-bottom:1px solid var(--hair);margin-bottom:14px}
.idh-name{font-family:var(--tMed);font-size:16px;color:var(--blu);margin-bottom:4px}
.idh-isin{font-family:var(--tBook);font-size:11.5px;color:var(--grigio);font-variant-numeric:tabular-nums}

/* ---- desktop ---- */


/* ---- toolbar confronto: testo e pulsante Svuota ben distanziati ---- */
.cmp-toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px}
.cmp-toolbar span{font-family:var(--tMed);font-size:12.5px;color:var(--blu)}

/* ---- contenitore ad altezza fissa per i loghi (MPS ovale vs Mediobanca wordmark hanno proporzioni molto diverse) ---- */
.logobox{display:inline-flex;align-items:center;justify-content:center;height:30px}
.logobox img{max-height:100%;max-width:100%;width:auto;height:auto;object-fit:contain}
.cmp-name .logobox{height:36px;margin:0 auto 6px;justify-content:center;width:100%}
.subheader-title .logobox{height:24px}

/* ---- confronto: asterisco Mediobanca, intestazioni di categoria nella tabella ---- */
.mbstar{color:var(--magenta);font-size:11px}
.cmp-cathead td{background:var(--avorio2);font-family:var(--tLight);text-transform:uppercase;letter-spacing:.1em;
  font-size:10px;color:var(--magenta);padding:7px 10px!important}

/* ---- home: selettore banca in alto (ingresso alternativo al profilo) ---- */
.bankpickrow{display:flex;gap:10px;padding:0 16px 4px}
.bankpick{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;background:#fff;border:1px solid var(--hair);
  border-radius:14px;padding:16px 12px;cursor:pointer}
.bankpick .logobox{height:44px}
.bankpick span{font-family:var(--tMed);font-size:12px;color:var(--blu)}

/* ---- stato banca attiva nella vista unificata ---- */
.bankcard.active{border-color:var(--magenta);box-shadow:0 0 0 1px var(--magenta) inset;background:rgba(208,63,101,.04)}
.bankcard.active .bankcard-cta{color:var(--pos)}

/* ---- selettore profilo compatto (percorso banca-first) ---- */
.proflist.compact{flex-direction:row;flex-wrap:wrap;gap:8px;padding:14px 16px}
.profcard.sm{flex:0 0 auto;min-width:0;padding:9px 13px;border-radius:12px}
.profcard.sm .profcard-top{gap:6px}

/* ---- pulsante dati aggregati a paniere ---- */
.basketbtn{display:flex;align-items:center;gap:8px;width:calc(100% - 32px);margin:0 16px 6px;
  background:var(--avorio2);border:1px dashed var(--hair);color:var(--blu);border-radius:12px;
  padding:11px 14px;font-family:var(--tMed);font-size:12px;cursor:pointer;text-align:left}
.basketblock{margin:10px 16px 18px}

/* ---- intestazione confronto: logo + codice portafoglio centrati (niente più nome banca ripetuto) ---- */
.cmp-name{text-align:center!important}

/* ---- paniere: intestazioni di categoria (stesso linguaggio del confronto) ---- */
.basketcat-h{font-family:var(--tLight);text-transform:uppercase;letter-spacing:.1em;font-size:10px;color:var(--magenta);
  padding:12px 2px 6px}

/* ---- pulsante paniere: più visibile, con indicazione apri/chiudi ---- */
.basketbtn{display:flex;align-items:center;gap:11px;width:calc(100% - 32px);margin:4px 16px 6px;
  background:#fff;border:1.5px solid var(--blu);color:var(--blu);border-radius:12px;
  padding:12px 14px;cursor:pointer;text-align:left}
.basketbtn-ic{flex:0 0 auto;color:var(--magenta)}
.basketbtn-txt{flex:1;display:flex;flex-direction:column;gap:2px;font-family:var(--tMed);font-size:12.5px}
.basketbtn-txt .tiny{font-family:var(--tBook)}
.basketbtn-chev{flex:0 0 auto;transition:transform .2s}
.basketbtn.open{background:var(--blu);color:#fff}
.basketbtn.open .basketbtn-ic{color:#fff}
.basketbtn.open .basketbtn-chev{transform:rotate(180deg)}

/* ---- card banca non selezionata: overlay grigino quando l'altra è aperta ---- */
.bankcard{position:relative}
.bankcard.dimmed{opacity:1}
.bankcard.dimmed::after{content:"";position:absolute;inset:0;background:rgba(245,241,233,.72);border-radius:17px;pointer-events:none}
.bankcard.dimmed .bankcard-cta{color:var(--grigio)}

</style>
</head>

/* ============ utility generiche riusate ============ */
function esc(s){ return (s==null?"":(""+s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function escq(s){ return (""+s).replace(/'/g,"\\'"); }
function copyText(txt,label){
  const done=()=>toast((label||"ISIN")+" copiato: "+txt);
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(done,()=>fallbackCopy(txt,done)); }
    else fallbackCopy(txt,done);
  }catch(e){ fallbackCopy(txt,done); }
}
function fallbackCopy(txt,done){
  try{ const ta=document.createElement("textarea"); ta.value=txt; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select(); document.execCommand("copy"); document.body.removeChild(ta); done&&done(); }
  catch(e){ toast("Copia non riuscita"); }
}
function copyIsin(isin,ev){ if(ev){ev.stopPropagation();} copyText(isin,"ISIN"); }
function isinChip(isin){   // pill ISIN monospace con tasto copia (riusata in lista/confronto/report)
  return `<span class="isinpill" onclick="copyIsin('${escq(isin)}',event)" title="Copia ISIN">

}

function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show");

function fgroup(lab,inner){ return `<div class="fg"><div class="lab">${lab}</div>${inner}</div>`; }
function platformAllowed(){
  const ua=(navigator.userAgent||"");
  const uad=navigator.userAgentData;
  const plat=(navigator.platform||"");
  const mtp=navigator.maxTouchPoints||0;
  // mobile / tablet -> sempre consentiti
  const isAndroid=/Android/i.test(ua);
  const isIOS=/iPhone|iPad|iPod/i.test(ua);
  const isIPadOS=/Mac/i.test(plat)&&mtp>1;               // iPadOS 13+ si maschera da Mac ma ha il touch
  if(isAndroid||isIOS||isIPadOS||(uad&&uad.mobile===true)) return true;
  // desktop: solo macOS
  if(uad&&uad.platform){                                  // Chromium (Chrome/Edge): dato affidabile
    if(uad.platform==="macOS") return true;
    return false;                                          // Windows / Linux / Chrome OS
  }
  if(/Windows|Win32|Win64|WOW64/i.test(ua)) return false; // fallback su stringa UA
  if(/Macintosh|Mac OS X/i.test(ua)) return true;
  return false;                                            // sconosciuto -> bloccato (policy: solo mobile + macOS)
}

/* ============ cross-reference con Sinottica e Analitica Fondi e ETF (ricerca robusta) ============ */
function findIsinCol(schema){
  const cands=["isin","i","Isin","ISIN","Codice Isin","codiceIsin"];
  for(const c of cands){ const idx=schema.indexOf(c); if(idx>=0) return idx; }
  return -1;
}
function decodeGeneric(db,row){
  const out={};
  db.schema.forEach((k,i)=>{
    let v=row[i];
    if(db.dicts && db.dicts[k] && typeof v==="number") v=db.dicts[k][v];
    out[k]=v;
  });
  return out;
}
/* ricerca per oggetti-riga (convenzione alternativa: rows:[{isin:...,nome:...}] invece di array-di-array con schema/dicts) */
function isinEq(a,b){ return a && b && String(a).trim().toUpperCase()===String(b).trim().toUpperCase(); }
/* scansione ricorsiva "a tentoni": funziona qualunque sia la struttura del JSON del catalogo
   (array di oggetti, oggetto indicizzato per ISIN, oggetto annidato sotto una chiave qualsiasi
   tipo "rows"/"data"/"bonds"/"items"...), cercando un oggetto che abbia da qualche parte un
   valore uguale all'ISIN cercato (case-insensitive, spazi ignorati). */
function deepFindByIsin(node,isin,depth){
  if(depth>5 || node==null) return null;
  if(Array.isArray(node)){
    for(const item of node){
      if(item && typeof item==="object" && !Array.isArray(item)){
        for(const k in item){ if(isinEq(item[k],isin)) return item; }
      }
    }
    for(const item of node){ const f=deepFindByIsin(item,isin,depth+1); if(f) return f; }
    return null;
  }
  if(typeof node==="object"){
    for(const k in node){ if(isinEq(k,isin) && node[k] && typeof node[k]==="object") return node[k]; }
    for(const k in node){ const f=deepFindByIsin(node[k],isin,depth+1); if(f) return f; }
  }
  return null;
}
function searchGeneric(db,isin){
  if(!db || db._status) return {found:null};
  // convenzione 1: {schema:[...], dicts:{...}, rows:[[...]]} - la convenzione usata dai tool Widiba costruiti in questa suite
  if(Array.isArray(db.schema) && Array.isArray(db.rows)){
    const iCol=findIsinCol(db.schema);
    if(iCol>=0){
      const row=db.rows.find(r=>isinEq(r[iCol],isin));
      if(row) return {found:decodeGeneric(db,row)};
    }
  }
  // convenzione 2+: qualunque altra struttura, ricerca ricorsiva a tentoni
  const deep=deepFindByIsin(db,isin,0);
  if(deep) return {found:deep};
  // ultima spiaggia: l'ISIN compare da qualche parte nel testo grezzo del file, ma non sono
  // riuscito a interpretarne la struttura -> lo dico chiaramente invece di dire "non presente"
  let rawHas=false;
  try{ rawHas = JSON.stringify(db).toUpperCase().includes(isin.toUpperCase()); }catch(e){}
  return {found:null, rawPresent:rawHas};
}
/* campi tecnici/ridondanti da non mostrare nella scheda sintetica: correlazioni (cXxx) e il campo
   "tipo strumento" del catalogo sorgente, che per gli ETP è sempre un valore generico ("Exchange-Traded
   Fund") anche per ETC/ETN e genererebbe confusione con il tipo corretto già mostrato in testa alla scheda */
function skipField(k){ return /^c[A-Z]/.test(k) || ["tipo","strumento","tipoStrumento","nav","navEur","navD"].includes(k); }
const FIELD_CATS=[
  {name:"Costi e dimensione", keys:["costi","commGest","commDist","payUp","payCont","aum"]},
  {name:"Performance", keys:["p1yB","p1y","p3y","p5y"]},
  {name:"Rischio", keys:["sd1","sd3","sh1","sh3","dd1","dd3","var","spread"]},
  {name:"Portafoglio e distribuzione", keys:["ratingMS","wl","whiteList","classe","distrib","status","leva","repl","cov","covMod"]},
];
function fieldCategory(k){ for(const c of FIELD_CATS) if(c.keys.includes(k)) return c.name; return "Altro"; }
const FIELD_LABELS={
  isin:"ISIN", i:"ISIN", nome:"Nome", n:"Nome", casa:"Casa di gestione", emittente:"Emittente",
  domicilio:"Domicilio", valuta:"Valuta", divBase:"Divisa Base", divPort:"Divisa del Portafoglio",
  macro:"Categoria", cat:"Categoria", sub:"Sotto categoria", msCat:"Categoria Morningstar",
  bench:"Benchmark primario", benchmark:"Benchmark primario",
  costi:"Costi correnti", commGest:"Comm. gestione", commDist:"Comm. distribuzione",
  payUp:"Upfront (sottoscr.)", payCont:"Continuing (gest.+distr.)",
  aum:"AUM strategia",
  p1yB:"Performance 1A Divisa Base", p1y:"Performance 1A EUR",
  p3y:"Performance 3A EUR", p5y:"Performance 5A EUR",
  ratingMS:"Rating Morningstar", sh1:"Sharpe 1A", sh3:"Sharpe 3A",
  sd1:"Deviazione standard 1A", sd3:"Deviazione standard 3A",
  dd1:"Max Drawdown 1A", dd3:"Max Drawdown 3A",
  var:"VaR", spread:"Bid/Ask spread",
  status:"Status", classe:"Classe", distrib:"Politica di distribuzione",
  wl:"Percentuali titoli obbligazionari in Paesi White List",
  whiteList:"Percentuali titoli obbligazionari in Paesi White List",
  leva:"Leva", repl:"Metodo di replica", tipo:"Tipologia strumento", anno:"Anno di lancio",
  cov:"Copertura valutaria", covMod:"Copertura valutaria (modalità)",
};
function niceLabel(k){ return FIELD_LABELS[k]||k.replace(/([A-Z])/g," $1").replace(/^./,c=>c.toUpperCase()); }
const FIELD_UNIT={
  costi:"pctp", commGest:"pctp", commDist:"pctp", payUp:"pctp", payCont:"pctp",
  p1yB:"pct", p1y:"pct", p3y:"pct", p5y:"pct",
  wl:"pctp", whiteList:"pctp",
  aum:"rank", sh1:"rank", sh3:"rank", sd1:"rank", sd3:"rank", dd1:"rank", dd3:"rank", var:"rank", spread:"rank",
};
function fmtVal(v,key){
  if(v==null||v==="") return "—";
  if(typeof v==="number"){
    const unit=key?FIELD_UNIT[key]:null;
    if(unit==="pct") return (v>0?"+":"")+v.toFixed(2)+"%";
    if(unit==="pctp") return v.toFixed(2)+"%";
    if(unit==="rank") return v.toFixed(1)+"/10";
    return Number.isInteger(v)?v.toLocaleString("it-IT"):v.toLocaleString("it-IT",{maximumFractionDigits:2});
  }
  return esc(String(v));
}

const CATALOG_SOURCES=[
  {file:"catalogo_analitica.json",label:"Analitica Fondi e ETF"},
  {file:"catalogo.json",label:"Sinottica"},
];
async function fetchCatalog(file){
  if(CATALOG_CACHE[file]!==undefined) return CATALOG_CACHE[file];
  try{
    const url=new URL(file, document.baseURI);
    const res=await fetch(url.href,{cache:"no-store"});
    if(!res.ok){ CATALOG_CACHE[file]={_status:"http_error",_code:res.status}; return CATALOG_CACHE[file]; }
    const j=await res.json();
    CATALOG_CACHE[file]=j; return j;
  }catch(e){ CATALOG_CACHE[file]={_status:"unreachable"}; return CATALOG_CACHE[file]; }
}
async function lookupInstrument(isin){
  const diag=[];
  if(!isin) return {found:false,diag:[{status:"no_isin"}]};
  for(const src of CATALOG_SOURCES){
    const db=await fetchCatalog(src.file);
    if(db && db._status){ diag.push({...src, status:db._status, code:db._code}); continue; }
    if(!db){ diag.push({...src, status:"vuoto"}); continue; }
    const res=searchGeneric(db,isin);
    if(res.found) return {found:true, source:src.label, file:src.file, data:res.found};
    diag.push({...src, status:res.rawPresent?"presente_non_interpretabile":"non_presente"});
  }
  return {found:false, diag};
}

/* ============ helper dati ============ */
function itemsForProfile(bankKey,code){
  return DATA.banche[bankKey].items.filter(it=>it.pesi[code]!=null).sort((a,b)=>(b.pesi[code]||0)-(a.pesi[code]||0));
}
function catBreakdown(items,code){
  const agg={};
  items.forEach(it=>{ const g=macroOf(it.catGroup); agg[g]=(agg[g]||0)+(it.pesi[code]||0); });
  return Object.entries(agg).sort((a,b)=>b[1]-a[1]);
}
function equityShare(bankKey,code){
  const items=itemsForProfile(bankKey,code);
  return items.filter(it=>macroOf(it.catGroup)==="Azionario").reduce((a,it)=>a+(it.pesi[code]||0),0);
}
function avgBreakdown(code){
  const b1=catBreakdown(itemsForProfile("mps",code),code);
  const b2=catBreakdown(itemsForProfile("mediobanca",code),code);
  const agg={};
  b1.forEach(([g,w])=>{ agg[g]=(agg[g]||0)+w/2; });
  b2.forEach(([g,w])=>{ agg[g]=(agg[g]||0)+w/2; });
  return Object.entries(agg).sort((a,b)=>b[1]-a[1]);
}
function riskScore(code){
  const a=equityShare("mps",code), b=equityShare("mediobanca",code);
  const vals=[a,b].filter(v=>v!=null);
  return vals.length?vals.reduce((x,y)=>x+y,0)/vals.length:0;
}
function pctFmt(v){ return (v*100).toLocaleString("it-IT",{maximumFractionDigits:1})+"%"; }

  document.querySelectorAll(".navbtn").forEach(b=>b.classList.toggle("on",b.dataset.mode===mode));

/* ============ confronto tra portafogli modello ============ */
function clearCmp(){ S.sel.clear(); S.cmpMeta={}; refreshCmpBadge(); renderCompare(); }
async function computePortfolioMetrics(bankKey,code){
  const items=itemsForProfile(bankKey,code);
  const withIsin=items.filter(it=>it.isin);
  const results=await Promise.all(withIsin.map(async it=>{
    const res=await lookupInstrument(it.isin);
    return {...it, w:it.pesi[code]||0, data:res.found?res.data:null};
  }));
  let coveredW=0, totalW=items.reduce((a,it)=>a+(it.pesi[code]||0),0);
  const weightedSum={}, weightedW={};
  results.forEach(r=>{
    if(!r.data) return;
    coveredW+=r.w;
    for(const k in r.data){
      if(skipField(k)) continue;
      if(typeof r.data[k]!=="number") continue;
      weightedSum[k]=(weightedSum[k]||0)+r.data[k]*r.w;
      weightedW[k]=(weightedW[k]||0)+r.w;
    }
  });
  const metrics={};
  for(const k in weightedSum){ if(weightedW[k]>0) metrics[k]=weightedSum[k]/weightedW[k]; }
  return {bankKey,code,items,totalW,coveredW,metrics,results};
}
async function renderCompare(){
  const el=document.getElementById("view-compare");
  if(!S.sel.size){ el.innerHTML=`<div class="empty" style="margin-top:40px"><div class="empty-ic">${ico('<path d="M3 3v18h18M7 15l4-5 3 3 5-7"/>',24)}</div><div class="empty-t">Nessun portafoglio nel confronto</div><div class="empty-s">Apri una proposta e tocca <b>+ Aggiungi questo portafoglio</b> — puoi confrontare fino a 4 portafogli, anche di banche o profili diversi.</div></div>`; return; }

  const keys=[...S.sel];
  let h=`<div class="cmp-toolbar"><span>${keys.length} portafogli selezionati</span><button class="btn ghost sm" onclick="clearCmp()">Svuota</button></div>`;
  h+=`<div class="loadingline" id="cmpLoad"><span class="spinner"></span> Calcolo delle metriche pesate dai cataloghi collegati…</div>`;
  el.innerHTML=h;

  const computed=await Promise.all(keys.map(k=>{ const m=S.cmpMeta[k]; return computePortfolioMetrics(m.bank,m.profile); }));
  if(!document.getElementById("cmpLoad")) return;

  h+=`<div class="cmp-scroll"><table class="cmp"><thead><tr><th class="rowlab">Voce</th>`;
  computed.forEach(c=>{
    const isMb=c.bankKey==="mediobanca";
    h+=`<th><div class="cmp-name">${logoImg(c.bankKey)}<br><span class="profcode sm">${c.code}</span>${isMb?'<sup class="mbstar">*</sup>':''}</div></th>`;
  });
  h+=`</tr></thead><tbody>`;
  h+=`<tr><td class="rowlab">Strumenti</td>`+computed.map(c=>`<td>${c.items.length}</td>`).join("")+`</tr>`;
  h+=`<tr><td class="rowlab">Copertura catalogo Widiba</td>`+computed.map(c=>{
    const pct=c.totalW?Math.round(100*c.coveredW/c.totalW):0;
    const cls=pct>=90?"pos":(pct>=60?"":"neg");
    return `<td class="${cls}">${pct}%</td>`;
  }).join("")+`</tr>`;

  const allKeys={}; computed.forEach(c=>{ for(const k in c.metrics) allKeys[k]=(allKeys[k]||0)+1; });
  const sharedKeys=Object.keys(allKeys).filter(k=>allKeys[k]>=2);
  // raggruppo per categoria e mantengo solo le categorie che hanno almeno un campo condiviso
  FIELD_CATS.forEach(fc=>{
    const keysInCat=fc.keys.filter(k=>sharedKeys.includes(k));
    if(!keysInCat.length) return;
    h+=`<tr class="cmp-cathead"><td colspan="${computed.length+1}">${esc(fc.name)}</td></tr>`;
    keysInCat.forEach(k=>{
      const vals=computed.map(c=>c.metrics[k]);
      const valid=vals.filter(v=>typeof v==="number");
      const hi=higherIsBetter2(k);
      const best=hi!==0&&valid.length>1?(hi>0?Math.max(...valid):Math.min(...valid)):null;
      const worst=hi!==0&&valid.length>1?(hi>0?Math.min(...valid):Math.max(...valid)):null;
      h+=`<tr><td class="rowlab">${esc(niceLabel(k))}</td>`;
      vals.forEach(v=>{ let cls=""; if(v!=null&&best!=null){ if(v===best)cls="best"; else if(v===worst)cls="worst"; }
        h+=`<td class="${cls}">${v==null?"—":fmtVal(v,k)}</td>`; });
      h+=`</tr>`;
    });
  });
  // eventuali campi condivisi non categorizzati (fallback, non dovrebbero comparire quasi mai)
  const uncategorized=sharedKeys.filter(k=>fieldCategory(k)==="Altro");
  if(uncategorized.length){
    h+=`<tr class="cmp-cathead"><td colspan="${computed.length+1}">Altro</td></tr>`;
    uncategorized.forEach(k=>{
      const vals=computed.map(c=>c.metrics[k]);
      h+=`<tr><td class="rowlab">${esc(niceLabel(k))}</td>`+vals.map(v=>`<td>${v==null?"—":fmtVal(v,k)}</td>`).join("")+`</tr>`;
    });
  }
  h+=`</tbody></table></div>
    <div class="tiny" style="margin:10px 2px 4px">Le metriche sono <b>medie ponderate per il peso di ciascuno strumento</b> nel portafoglio, calcolate solo sugli strumenti trovati nei cataloghi collegati (vedi copertura). <span class="pos">Verde</span> = migliore · <span class="neg">rosso</span> = peggiore.</div>`;
  if(computed.some(c=>c.bankKey==="mediobanca")){
    h+=`<div class="tiny" style="margin:2px 2px 4px">* ${esc(MB_INDICATIVO)}</div>`;
  }
  h+=`<div class="alertbox" style="margin:10px 2px">⚠️ ${BASKET_DISCLAIMER}</div>`;

  h+=`<div class="block"><div class="bh">Allocazione per categoria</div>`;
  h+=allocLegend();
  computed.forEach(c=>{
    const breakdown=catBreakdown(c.items,c.code);
    h+=`<div class="cmp-alloc-row"><div class="cmp-alloc-label">${logoImg(c.bankKey)} ${esc(BANK_META[c.bankKey].short)} · ${c.code}</div>
      <div class="allocbar sm">${breakdown.map(([g,w])=>`<div class="allocseg" style="width:${w*100}%;background:${catColor(g)}" title="${esc(g)} ${pctFmt(w)}"></div>`).join("")}</div></div>`;
  });
  h+=`</div>`;

  el.innerHTML=h;
}
function higherIsBetter2(key){
  const k=key.toLowerCase();
  if(/cost|spread|var\b|^sd|devstd|dd\d|drawdown|commiss|ter\b/.test(k)) return -1;
  if(/perf|^p\d|sharpe|^sh\d|rating|aum/.test(k)) return 1;
  return 0;
}

const DEFAULT_LOCAL_SRC="portafogli_modello_data.json";
let S_LAST_SYNC=null;
function loadStoredData(){ try{ const raw=localStorage.getItem("portafogli_data"); return raw?JSON.parse(raw):null; }catch(e){ return null; } }
function storeData(d){ try{ localStorage.setItem("portafogli_data", JSON.stringify(d)); }catch(e){} }
function commitData(d){ DATA=d; if(S.mode==="home") renderHome(); if(S.mode==="banks") renderMain(); }
async function autoSync(silent){
  try{
    const url=new URL(DEFAULT_LOCAL_SRC, document.baseURI);
    const res=await fetch(url.href,{cache:"no-store"});
    if(!res.ok) return;
    const j=await res.json();
    if(!j||!j.banche||!j.profiles) return;
    if(DATA && j.generato && DATA.generato && j.generato<=DATA.generato){ S_LAST_SYNC=new Date().toISOString(); if(!silent)toast("Dati già aggiornati"); return; }
    commitData(j); storeData(j);
    S_LAST_SYNC=new Date().toISOString();
    if(!silent) toast("Dati aggiornati al "+j.generato);
  }catch(e){ if(!silent) toast("Aggiornamento non riuscito"); }
}
async function onPickPortJson(input){
  const file=input.files[0]; if(!file) return;
  const st=document.getElementById("portUpStatus");
  try{
    const j=JSON.parse(await file.text());
    if(!j.banche||!j.profiles) throw new Error("vuoto");
    commitData(j); storeData(j);
    if(st) st.textContent="Caricati "+Object.keys(j.banche).length+" banche · v. "+j.generato;
    toast("Dati aggiornati");
  }catch(e){ if(st) st.textContent="File non leggibile: "+((e&&e.message)||e); }
}
function dataInfoBlock(){
  const lastSyncTxt=S_LAST_SYNC?new Date(S_LAST_SYNC).toLocaleString("it-IT"):"mai in questa sessione";
  return `<div class="legend-title" style="margin-top:18px">Dati</div>
    <div class="notfound-banner" style="margin-bottom:10px">Versione dati in uso: <b>${esc(DATA.generato||"—")}</b> · ultima verifica aggiornamento: ${lastSyncTxt}</div>
    <button class="btn ghost sm" onclick="autoSync(false)">Verifica aggiornamenti ora</button>
    <div class="tiny" style="margin:12px 0 6px">Carica manualmente un file <code>portafogli_modello_data.json</code> generato dal converter</div>
    <input type="file" id="portJsonPick" accept=".json" style="display:none" onchange="onPickPortJson(this)">
    <button class="btn ghost sm" onclick="document.getElementById('portJsonPick').click()">Scegli file</button>
    <div id="portUpStatus" class="tiny" style="margin-top:8px"></div>`;
}

window.addEventListener("load",()=>{
  if(!platformAllowed()){ showPlatformBlock(); return; }
  const stored=loadStoredData();
  DATA=(stored&&stored.banche&&stored.profiles)?stored:DATA_RAW;
  renderHome();
  document.getElementById("splash").style.display="none";
  document.getElementById("app").classList.remove("hidden");
  goto("home");
  autoSync(true);
});

</script>
</body>
</html>
