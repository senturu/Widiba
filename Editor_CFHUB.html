:root{--magenta:#D03F65;--blu:#2C2E39;--avorio:#F5F1E9;--app:#F3F0EA;--hair:#E3DACB;--grigio:#958B87;--grigio2:#6B6763;--ok:#3E7C66;--warn:#B8752B;--panel:#FFFFFF;--soft:#FAF8F4}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#ECE7DE;color:var(--blu);font-family:WidibaBook,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
/* ===== barra superiore ===== */
#top{height:56px;display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--blu);color:#fff}
#top .logo{height:22px;display:block}
#top .app{font-family:WidibaMedium;font-size:13px;letter-spacing:.14em;text-transform:uppercase;opacity:.85;margin-right:8px;white-space:nowrap}
#top .grow{flex:1}
#top input.ptitle{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:8px;color:#fff;padding:7px 10px;width:300px}
#top input.pid{width:70px}
#top .tb{background:transparent;border:1px solid rgba(255,255,255,.28);color:#fff;border-radius:8px;padding:7px 11px;white-space:nowrap}
#top .tb:hover{background:rgba(255,255,255,.1)}
#top .tb.pri{background:var(--magenta);border-color:var(--magenta)}
#top .tb.pri:hover{filter:brightness(1.07)}
#top .sep{width:1px;height:26px;background:rgba(255,255,255,.2)}
#saved{font-size:11.5px;opacity:.7;white-space:nowrap}
/* ===== layout ===== */
#main{display:grid;grid-template-columns:232px 1fr 340px;grid-template-rows:minmax(0,1fr);height:calc(100% - 56px)}
#main>*{min-height:0;height:100%}
#pal,#props{background:var(--panel);overflow:auto}
#pal{border-right:1px solid var(--hair);padding:12px 10px 40px}
#props{border-left:1px solid var(--hair);padding:0 0 60px}
#center{display:flex;flex-direction:column;min-width:0;overflow:hidden}
/* palette */
.pgrp{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--magenta);font-family:WidibaMedium;margin:14px 6px 6px}
.pgrp:first-child{margin-top:2px}
.pbtn{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:1px solid transparent;border-radius:9px;padding:7px 8px;font-size:13px}
.pbtn:hover{background:var(--soft);border-color:var(--hair)}
.pbtn svg{width:18px;height:18px;flex:0 0 auto;stroke:var(--blu);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.pbtn.feat{background:#FBEFF2;border-color:#F1CBD6}
.pbtn.feat svg{stroke:var(--magenta)}
.where{margin:6px 6px 2px;font-size:11.5px;color:var(--grigio2);line-height:1.4}
.where b{color:var(--blu)}
/* toolbar testo */
#tbar{flex:0 0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:4px;padding:7px 10px;background:#fff;border-bottom:1px solid var(--hair);min-height:48px}
#tbar .g{display:flex;gap:2px;padding-right:6px;margin-right:2px;border-right:1px solid var(--hair)}
#tbar .g:last-child{border-right:0}
#tbar button{min-width:32px;height:32px;border:1px solid transparent;background:none;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;padding:0 7px;font-size:13px}
#tbar button:hover{background:var(--soft);border-color:var(--hair)}
#tbar button.on{background:#FBEFF2;border-color:#F1CBD6;color:var(--magenta)}
#tbar button svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#tbar select{height:32px;border:1px solid var(--hair);border-radius:7px;background:#fff;padding:0 6px;font-size:12.5px}
#tbar.off button,#tbar.off select{opacity:.35;pointer-events:none}
#tbar.off .always{opacity:1;pointer-events:auto}
#tbar .hint{font-size:11.5px;color:var(--grigio2);margin-left:auto}
.swwrap{position:relative}
#sw{position:absolute;top:36px;left:0;z-index:50;background:#fff;border:1px solid var(--hair);border-radius:12px;box-shadow:0 10px 30px rgba(44,46,57,.16);padding:10px;width:282px;display:none}
#sw.on{display:block}
#sw .sl{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--grigio2);margin:6px 2px 5px}
#sw .row{display:flex;flex-wrap:wrap;gap:5px}
#sw .c{width:28px;height:28px;border-radius:7px;border:1px solid rgba(0,0,0,.12);cursor:pointer}
#sw .c:hover{outline:2px solid var(--magenta);outline-offset:1px}
#sw .auto{width:auto;padding:0 9px;font-size:12px;display:flex;align-items:center;background:#fff}
/* area canvas */
#stage{flex:1 1 auto;min-height:0;overflow:auto;padding:22px 20px 120px;display:flex;justify-content:center}
#phone{width:400px;flex:0 0 auto;background:var(--app);border-radius:30px;box-shadow:0 18px 50px rgba(44,46,57,.18),0 0 0 9px #fff,0 0 0 10px var(--hair);min-height:760px;padding-bottom:30px;position:relative}
#phone.wide{width:680px}
#phone .apphead{height:56px;line-height:56px;text-align:center;position:relative;font-family:WidibaMedium;font-size:16px;padding:0 44px 0 52px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#phone .apphead:before{content:"";position:absolute;left:20px;top:21px;width:11px;height:11px;border-left:2px solid var(--blu);border-bottom:2px solid var(--blu);transform:rotate(45deg)}
#canvas{padding:22px 0 0}
.empty{margin:40px 24px;padding:26px;border:1.5px dashed var(--hair);border-radius:16px;text-align:center;color:var(--grigio2);line-height:1.5}
/* blocchi */
.blk{position:relative;outline:1px dashed transparent;outline-offset:-1px;border-radius:4px;transition:outline-color .12s}
.blk:hover{outline-color:#D9CFC0}
.blk.sel{outline:2px solid var(--magenta);outline-offset:-2px}
.blk>.bl{position:absolute;top:-20px;left:-1px;z-index:5;display:none;align-items:center;gap:2px;background:var(--magenta);color:#fff;font-size:10.5px;font-family:WidibaMedium;border-radius:5px 5px 0 0;padding:0 2px 0 7px;height:21px;letter-spacing:.03em;max-width:100%}
.blk.sel>.bl{display:flex}
.blk:hover:not(.sel)>.bl{display:flex;background:#B9B0A2}
.bl .bn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:190px;margin-right:4px}
.bl button{background:none;border:0;color:#fff;width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;border-radius:4px;padding:0}
.bl button:hover{background:rgba(255,255,255,.22)}
.bl svg{width:13px;height:13px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.kids{min-height:34px}
.kids.emptyk:after{content:"Contenitore vuoto · selezionalo e inserisci un elemento";display:block;margin:6px 16px;padding:9px;border:1.5px dashed #D9CFC0;border-radius:10px;font-size:11.5px;color:var(--grigio);text-align:center}
/* resa "app" */
.rt,.rtv{outline:none;font-size:15px;line-height:1.42;letter-spacing:.15px;color:var(--blu);word-wrap:break-word}
.rt p,.rtv p,.rt li,.rtv li{margin:0}
.rt ul,.rt ol,.rtv ul,.rtv ol{margin:0;padding-left:22px}
.rt a,.rtv a{color:var(--magenta);text-decoration:underline}
.ql-align-center{text-align:center}.ql-align-right{text-align:right}.ql-align-justify{text-align:justify}
.ql-size-small{font-size:12px}.ql-size-large{font-size:19px}.ql-size-huge{font-size:24px}
.futureStyle-headline1{font-family:WidibaBold;font-size:32px;line-height:1.16}
.futureStyle-headline2{font-family:WidibaBold;font-size:27px;line-height:1.18}
.futureStyle-headline3{font-family:WidibaBold;font-size:22px;line-height:1.22}
.futureStyle-headline4{font-family:WidibaMedium;font-size:19px;line-height:1.25}
.futureStyle-headline5{font-family:WidibaMedium;font-size:17px;line-height:1.28}
.futureStyle-headline6{font-family:WidibaMedium;font-size:15px;line-height:1.3;letter-spacing:.3px}
.rt strong,.rt b,.rtv strong{font-family:WidibaBold;font-weight:400}
.rt em,.rt i{font-style:italic}
.rt:empty:before{content:attr(data-ph);color:#B6AEA4}
.rt[contenteditable]:focus{background:rgba(255,255,255,.55);box-shadow:inset 0 0 0 1px #EBD3DA;border-radius:4px}
.st-body_large{font-size:16.5px}.st-title_small{font-family:WidibaMedium;font-size:15.5px}.st-subtitle{font-family:WidibaMedium;font-size:17px}.st-body_text{font-size:15px}
.ptext{padding:6px 18px}
.pimg{padding:6px 18px}
.pimg.full{padding:6px 0}
.imgbox{width:100%;overflow:hidden;background:#E8E2D8;display:flex;align-items:center;justify-content:center;position:relative}
.imgbox img{display:block;width:100%;height:100%}
.ph{width:100%;aspect-ratio:16/9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#8C8279;font-size:12px;text-align:center;padding:10px;background:repeating-linear-gradient(45deg,#EDE7DE 0 10px,#E6DFD4 10px 20px)}
.ph svg{width:30px;height:30px;stroke:#8C8279;fill:none;stroke-width:1.5}
.ph b{font-family:WidibaMedium;color:#6B6159}
.zoomb{position:absolute;right:8px;bottom:8px;background:rgba(44,46,57,.85);color:#fff;font-size:10.5px;border-radius:20px;padding:3px 9px;font-family:WidibaMedium;letter-spacing:.04em}
.linkb{position:absolute;left:8px;bottom:8px;background:rgba(208,63,101,.92);color:#fff;font-size:10.5px;border-radius:20px;padding:3px 9px;font-family:WidibaMedium;max-width:80%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard{margin:8px 18px;background:#fff;border-radius:8px;box-shadow:0 2px 8px rgba(44,46,57,.10);overflow:hidden}
.pcard .det{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;padding:10px 14px;background:#ADA9A3}
.pcard .det .t{font-family:WidibaBold;font-size:17px;line-height:1.2}
.pcard .det .c{font-size:13.5px}
.pcard .det .t:empty,.pcard .det .c:empty{display:none}
.pcard .cta{padding:10px 14px}
.pcar{display:flex;gap:10px;overflow-x:auto;padding:8px 18px 12px;scroll-snap-type:x mandatory}
.pcar>.blk{flex:0 0 72%;scroll-snap-align:start}
.pcar>.blk .pcard{margin:0}
.prow{display:flex;align-items:center;gap:12px;padding:13px 18px;min-height:54px}
.prow .lead{width:44px;height:44px;flex:0 0 auto;border-radius:6px;overflow:hidden}
.prow .lead .ph{aspect-ratio:1;padding:2px}
.prow .lead .ph svg{width:18px;height:18px}
.prow .lead .ph b,.prow .lead .ph span{display:none}
.prow .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.prow .tx .rt{font-size:15px}
.prow .sub .rt{font-size:13px;color:#56575F}
.prow .chev{width:10px;height:10px;border-right:2px solid var(--blu);border-top:2px solid var(--blu);transform:rotate(45deg);flex:0 0 auto;margin-right:4px}
.ptag{display:inline-block;color:#fff;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;padding:4px 12px;border-radius:3px;white-space:nowrap;font-family:WidibaBook}
.pbtnw{padding:8px 18px}
.appbtn{display:inline-flex;align-items:center;gap:8px;border-radius:30px;padding:9px 20px;font-size:13.5px;letter-spacing:.08em;text-transform:uppercase;border:1.5px solid var(--blu);background:transparent;color:var(--blu);white-space:nowrap}
.appbtn.filled{background:var(--blu);color:#fff}
.appbtn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.plist>.kids>.blk+.blk{border-top:1px solid #DDD5C9}
.pitem.box{margin:8px 18px;background:#fff;border-radius:10px;box-shadow:0 2px 8px rgba(44,46,57,.08)}
.pgrid>.kids{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:10px 18px}
.pgel{background:#EFECE6;border-radius:14px;padding:16px 12px 12px;text-align:center}
.pgel .tile{width:72%;margin:0 auto;aspect-ratio:1;border-radius:22px;background:#FBFAF7;box-shadow:0 6px 14px rgba(44,46,57,.10);overflow:hidden;display:flex;align-items:center;justify-content:center}
.pgel .tile img{width:100%;height:100%;object-fit:contain}
.pgel .tile .ph{aspect-ratio:1;background:none}
.pgel .lab{margin-top:12px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-family:WidibaMedium;line-height:1.3}
.ptabs .heads{display:flex;justify-content:center;gap:18px;padding:12px 18px 8px;font-family:WidibaBold;font-size:15px;letter-spacing:.05em;text-transform:uppercase}
.ptabs .heads span{color:#C9C3BA;cursor:pointer}
.ptabs .heads span.on{color:var(--blu)}
.plv{display:flex;gap:10px;justify-content:space-between;padding:8px 18px;font-size:15px}
.plv .v{text-align:right}
.psc{margin:8px 18px;background:#fff;border-radius:10px;padding:4px 0;box-shadow:0 2px 8px rgba(44,46,57,.08)}
.psc .prow{padding:10px 14px}
.pnest,.papi{margin:8px 18px;padding:14px;border:1.5px dashed #C9BFB0;border-radius:10px;font-size:12.5px;color:var(--grigio2);text-align:center;background:rgba(255,255,255,.5)}
.pnest b,.papi b{color:var(--blu);font-family:WidibaMedium}
.pspacer{position:relative}
.pspacer.thin{margin:0 18px}
/* proprietà */
#props h3{margin:0;padding:14px 16px 10px;font-family:WidibaMedium;font-weight:400;font-size:15px;border-bottom:1px solid var(--hair);position:sticky;top:0;background:#fff;z-index:3;display:flex;align-items:center;gap:8px}
#props h3 .tp{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:#fff;background:var(--blu);border-radius:5px;padding:3px 7px;font-family:WidibaMedium}
.sec{padding:12px 16px;border-bottom:1px solid #F0EBE3}
.sec>.st{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--magenta);font-family:WidibaMedium;margin-bottom:8px}
.fl{display:block;font-size:11.5px;color:var(--grigio2);margin:9px 0 4px}
.fl:first-of-type{margin-top:0}
.in,.sel2,textarea.in{width:100%;border:1px solid var(--hair);border-radius:8px;padding:7px 9px;background:#fff;font-size:13px}
textarea.in{resize:vertical;min-height:64px;font-family:ui-monospace,Menlo,monospace;font-size:11.5px}
.in:focus,.sel2:focus{outline:2px solid #F1CBD6;border-color:#E6B6C3}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;margin:8px 0}
.chk input{accent-color:var(--magenta);width:16px;height:16px}
.btn{border:1px solid var(--blu);background:#fff;border-radius:8px;padding:7px 12px;font-size:13px}
.btn:hover{background:var(--soft)}
.btn.pri{background:var(--magenta);border-color:var(--magenta);color:#fff}
.btn.pri:hover{filter:brightness(1.06)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.danger{border-color:#C24;color:#C24}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.note{font-size:11.5px;color:var(--grigio2);line-height:1.45;margin-top:6px}
.note.w{color:var(--warn)}
.note b{color:var(--blu)}
.thumb{margin-top:8px;border:1px solid var(--hair);border-radius:8px;overflow:hidden;background:repeating-conic-gradient(#eee 0 25%,#fff 0 50%) 0 0/14px 14px}
.thumb img{display:block;max-width:100%;max-height:180px;margin:0 auto}
.drop{border:1.5px dashed #D2C7B7;border-radius:10px;padding:14px;text-align:center;font-size:12.5px;color:var(--grigio2);cursor:pointer;background:var(--soft)}
.drop:hover,.drop.over{border-color:var(--magenta);color:var(--magenta)}
.cnt{float:right;font-size:11px}
.cnt.w{color:var(--warn)}
.colors{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.colors .c{width:24px;height:24px;border-radius:6px;border:1px solid rgba(0,0,0,.12);cursor:pointer}
.colors .c.on{outline:2px solid var(--blu);outline-offset:1px}
.pagep .sec:first-of-type{padding-top:14px}
.outline{font-size:12.5px}
.outline .oi{display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:6px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.outline .oi:hover{background:var(--soft)}
.outline .oi .ty{font-size:10px;color:#fff;background:#B9B0A2;border-radius:4px;padding:1px 5px;font-family:WidibaMedium;flex:0 0 auto}
.outline .oi.as .ty{background:var(--magenta)}
/* modali */
.mback{position:fixed;inset:0;background:rgba(44,46,57,.45);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:#fff;border-radius:16px;box-shadow:0 30px 80px rgba(0,0,0,.3);width:min(560px,100%);max-height:calc(100vh - 40px);display:flex;flex-direction:column}
.modal.big{width:min(1040px,100%)}
.modal .mh{padding:16px 20px;border-bottom:1px solid var(--hair);font-family:WidibaBold;font-size:17px;display:flex;align-items:center;gap:10px}
.modal .mh .x{margin-left:auto;border:0;background:none;font-size:22px;line-height:1;color:var(--grigio2)}
.modal .mb{padding:16px 20px;overflow:auto}
.modal .mf{padding:12px 20px;border-top:1px solid var(--hair);display:flex;gap:8px;justify-content:flex-end;align-items:center}
.modal .mf .note{margin:0 auto 0 0}
.issues{margin:0;padding:0;list-style:none}
.issues li{padding:7px 10px;border-radius:8px;margin-bottom:5px;font-size:13px;line-height:1.4;background:#FFF6EA;border-left:3px solid var(--warn)}
.issues li.ok{background:#EEF6F1;border-color:var(--ok)}
.issues li.info{background:var(--soft);border-color:#B9B0A2}
pre.code{background:#1F2029;color:#E9E6F0;border-radius:10px;padding:12px;font-size:11.5px;line-height:1.45;overflow:auto;max-height:60vh;white-space:pre-wrap;word-break:break-all}
/* generatore SiF */
.sifgrid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.siflist{max-height:52vh;overflow:auto;border:1px solid var(--hair);border-radius:10px;padding:4px 8px}
.siflist h4{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--magenta);font-family:WidibaMedium;font-weight:400;margin:10px 0 4px}
.siflist label{display:flex;align-items:center;gap:8px;padding:5px 2px;font-size:13px;border-bottom:1px solid #F2EEE7;cursor:pointer}
.siflist label input{accent-color:var(--magenta)}
.siflist label .n{margin-left:auto;font-size:11px;color:var(--grigio2);white-space:nowrap}
.siflist label.zero .n{color:var(--magenta)}
.sifprev{background:repeating-conic-gradient(#eee 0 25%,#fff 0 50%) 0 0/16px 16px;border-radius:10px;border:1px solid var(--hair);padding:8px;min-height:120px;display:flex;flex-direction:column;gap:8px;max-height:44vh;overflow:auto}
.sifprev img{max-width:100%;display:block}
.radio{display:flex;flex-direction:column;gap:6px;margin:6px 0}
.radio label{display:flex;gap:8px;align-items:flex-start;font-size:13px;cursor:pointer}
.radio input{accent-color:var(--magenta);margin-top:2px}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--blu);color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;opacity:0;transition:.22s;z-index:200;pointer-events:none;max-width:80vw}
#toast.on{opacity:1;transform:translateX(-50%)}
.hidden{display:none!important}
@media (max-width:1100px){#main{grid-template-columns:200px 1fr 300px}#top input.ptitle{width:180px}}

@media (max-width:1480px){#top .app{display:none}#top input.ptitle{width:220px}#top input.pid{width:60px}}
@media (max-width:1260px){#saved{display:none}#top .tb{padding:7px 9px}#top input.ptitle{width:160px}}

/* =====================================================================

   stesso HTML che produce l'editor del backoffice (Quill):
   <p class="ql-align-justify">, <strong>, <em>, <u>, <s>, <a href>,

   <span style="color: rgb(r, g, b);">, <ul>/<ol><li>, riga vuota = <p><br></p>

const RT={};

RT.normalize=function(root){

    m=Object.assign({},m);

    if(t==="A"&&el.getAttribute("href")) m.a=el.getAttribute("href");
    if(t==="H1"||t==="H2"||t==="H3"||t==="H4"||t==="H5"||t==="H6") m.hd=+t[1];
    const fw=st.fontWeight; if(fw==="bold"||+fw>=600) m.b=1; else if(fw==="normal"||(+fw&&+fw<600)) delete m.b;
    if(st.fontStyle==="italic") m.i=1;
    const td=(st.textDecoration||"")+" "+(st.textDecorationLine||""); if(/underline/.test(td)) m.u=1; if(/line-through/.test(td)) m.s=1;
    const col=st.color||(t==="FONT"&&el.getAttribute("color")); if(col){ const r=toRgb(col); if(r) m.c=(r===SENTINEL?null:r); }
    if(t==="FONT"&&el.getAttribute("size")){const s=+el.getAttribute("size"); m.z=s<=2?"small":s>=4?"large":null;}
    if(el.classList){ for(const c of el.classList){ let mm;
      if(c==="ql-size-small"||c==="ql-size-large"||c==="ql-size-huge") m.z=c.slice(8);
      if((mm=/^futureStyle-headline(\d)$/.exec(c))) m.hd=+mm[1];
      if(c==="hd0") delete m.hd; } }
    return m;
  }
  function blockCtx(el,ctx){
    const c=Object.assign({},ctx);
    let al=""; if(el.classList) for(const k of el.classList){const mm=/^ql-align-(center|right|justify)$/.exec(k); if(mm) al=mm[1];}
    const ta=(el.style&&el.style.textAlign)||el.getAttribute&&el.getAttribute("align");
    if(!al&&ta&&/center|right|justify/.test(ta)) al=ta.match(/center|right|justify/)[0];
    if(al) c.align=al; else if(el.tagName!=="LI") c.align=ctx.align||"";
    if(el.tagName==="UL") c.list="bullet"; if(el.tagName==="OL") c.list="ordered";
    return c;

    if(n.nodeType===3){ const t=n.nodeValue.replace(/[\r\n\t]+/g," "); if(!t||(!cur&&!t.trim())) return; ensure(ctx).runs.push({t,m}); return; }
    if(n.nodeType!==1) return;
    const tg=n.tagName;
    if(tg==="SCRIPT"||tg==="STYLE"||tg==="META"||tg==="TITLE"||tg==="O:P"||tg==="IMG"||tg==="SVG") return;
    if(tg==="BR"){ const l=ensure(ctx); let nx=n.nextSibling; while(nx&&nx.nodeType===3&&!nx.nodeValue.trim()) nx=nx.nextSibling;
      const blk=n.parentNode&&BLOCKTAGS.has(n.parentNode.tagName)?n.parentNode:null;
      if(nx||!blk){ cur=null; l._br=1; } return; }
    const mk=marksOf(n,m);
    if(BLOCKTAGS.has(tg)){
      const c=blockCtx(n,ctx);
      if(tg==="UL"||tg==="OL"){ cur=null; for(const k of n.childNodes) walk(k,mk,c); cur=null; return; }

      for(const k of n.childNodes) walk(k,mk,c); cur=null; return;

const eqm=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
RT.inline=function(runs){

RT.serialize=function(lines){

    else { close(); h+=`<p${cls}>${RT.inline(l.runs)}</p>`; }

const App={};
const UNDO=[],REDO=[]; let lastSnap="";
App.snap=()=>JSON.stringify({id:PAGE.id,title:PAGE.title,blocks:PAGE.blocks});
App.pushUndo=function(){ const s=App.snap(); if(s===lastSnap) return; if(lastSnap) UNDO.push(lastSnap); if(UNDO.length>80) UNDO.shift(); REDO.length=0; lastSnap=s; };
App.restoreSnap=function(s){ const o=JSON.parse(s); PAGE.id=o.id; PAGE.title=o.title; PAGE.blocks=o.blocks; lastSnap=s; SEL=null; App.syncTop(); App.render(); App.props(); App.autosave(); };
App.undo=function(){ App.pushUndo(); if(!UNDO.length) return toast("Niente da annullare"); REDO.push(lastSnap); App.restoreSnap(UNDO.pop()); };
App.redo=function(){ if(!REDO.length) return toast("Niente da ripetere"); UNDO.push(lastSnap); App.restoreSnap(REDO.pop()); };
let _ct=null;
App.changed=function(u,light){ clearTimeout(_ct); _ct=setTimeout(App.pushUndo,500); App.autosave(); if(!light){ App.render(); App.props(); } else App.outlineRefresh(); };
App.render=function(){ R.page(); App.outlineRefresh(); };
App.select=function(u,fromField){
  if(SEL===u&&fromField) return;
  SEL=u; $$(".blk.sel").forEach(x=>x.classList.remove("sel")); const el=$(`.blk[data-u="${u}"]`); if(el) el.classList.add("sel");
  App.props(); $("#props").scrollTop=0; App.palHint();
};
App.deselect=function(){ SEL=null; $$(".blk.sel").forEach(x=>x.classList.remove("sel")); App.props(); App.palHint(); };
App.syncTop=function(){ $("#pTitle").value=PAGE.title||""; $("#pId").value=PAGE.id||""; $("#appHead").textContent=PAGE.title||""; document.title=(PAGE.title?PAGE.title+" · ":"")+"Editor pagine CF HUB"; };

/* ---------- inserimento ---------- */
const ACCEPT={carousel:["card"],grid_layout:["grid_element"]};
function accepts(c,b){ const a=ACCEPT[c.type]; return a?a.includes(b.type):true; }
App.where=function(nb){
  const s=sel(); if(!s) return {list:PAGE.blocks,index:PAGE.blocks.length,desc:"in fondo alla pagina"};
  const info=BYID.get(SEL);
  if(isContainer(s)&&accepts(s,nb)){ const k=kidsOf(s); return {list:k,index:k.length,desc:"dentro "+typeLabel(s)}; }
  // dentro un contenitore che non lo accetta: dopo il contenitore
  let cur=info; while(cur&&cur.parent&&!accepts(cur.parent,nb)) cur=BYID.get(uid(cur.parent));
  if(cur&&cur!==info&&cur.list){ const i=cur.list.indexOf(cur.b); return {list:cur.list,index:i+1,desc:"dopo "+typeLabel(cur.b)}; }
  const i=info.list.indexOf(s); return {list:info.list,index:i+1,desc:"dopo "+typeLabel(s)};
};
App.insert=function(kind,opts={}){
  const nb=typeof kind==="string"?T[kind]():kind;
  const w=App.where(nb); w.list.splice(w.index,0,nb);
  reindex(); SEL=uid(nb); App.pushUndo(); App.render(); App.props(); App.autosave();
  setTimeout(()=>{ const el=$(`.blk[data-u="${SEL}"]`); if(el){ el.scrollIntoView({block:"center",behavior:"smooth"}); const f=opts.focus!==false&&el.querySelector(".rt"); if(f) f.focus(); } },60);
  return nb;
};
App.act=function(u,a){
  const info=BYID.get(u); if(!info) return; const {b,list}=info; const i=list.indexOf(b);
  if(a==="up"&&i>0){ list.splice(i,1); list.splice(i-1,0,b); }
  else if(a==="down"&&i<list.length-1){ list.splice(i,1); list.splice(i+1,0,b); }
  else if(a==="dup"){ const c=App.cloneBlock(b); list.splice(i+1,0,c); reindex(); SEL=uid(c); }
  else if(a==="del"){ list.splice(i,1); if(SEL===u) SEL=null; }
  else return;
  App.pushUndo(); App.render(); App.props(); App.autosave();
};
App.cloneBlock=function(b){ const c=JSON.parse(JSON.stringify(b)); /* gli asset restano condivisi: stesso file */ return c; };

  ["Immagini e documenti",[["image","image","Immagine"],["zoom","zoom","Immagine ingrandibile (con PDF)",1],["doc_row","doc","Documento PDF"],["card","card","Card con immagine"],["carousel","carousel","Carosello di card"]]],
  ["Righe e pulsanti",[["action_row","row","Riga con freccia"],["button","button","Pulsante"],["tag","tag","Etichetta colorata"],["structured_content","news","Notizia (titolo, fonte, Vai)"],["label_value_row","lv","Etichetta e valore"]]],
  ["Struttura",[["spacer","spacer","Spaziatura"],["divider","divider","Linea divisoria"],["item_display","box","Contenitore"],["list_items","list","Lista con divisori"],["grid_layout","grid","Griglia di icone"],["tabs","tabs","Schede"],["nested_page","page","Pagina collegata"]]],
  ["Strumenti CF",[["__sif","sif","Strumenti in Focus · link e immagini",1]]],
];
App.palette=function(){
  let s=`<div class="where" id="palWhere"></div>`;
  for(const [g,items] of PAL){ s+=`<div class="pgrp">${g}</div>`; for(const [k,ic,l,f] of items) s+=`<button class="pbtn${f?" feat":""}" data-k="${k}">${ico(ic)}<span>${l}</span></button>`; }
  s+=`<div class="pgrp">Aiuto</div><div class="where">Clicca un elemento nella pagina per selezionarlo: a destra trovi le sue impostazioni (immagine, link, stile). Il nuovo elemento viene inserito <b>dopo</b> quello selezionato, o <b>dentro</b> se è un contenitore.<br><br>Quando hai finito, <b>Scarica pacchetto</b> crea lo zip con JSON, immagini, PDF e istruzioni.</div>`;
  $("#pal").innerHTML=s;
  $("#pal").addEventListener("click",e=>{ const b=e.target.closest(".pbtn"); if(!b) return; const k=b.dataset.k; if(k==="__sif") return SIF.open(); App.insert(k); });
  App.palHint();
};
App.palHint=function(){ const el=$("#palWhere"); if(!el) return; const s=sel(); el.innerHTML=s?`Inserisci: <b>${esc(App.where(T.text()).desc)}</b> · <a href="#" onclick="App.deselect();return false">in fondo</a>`:"Inserisci: <b>in fondo alla pagina</b>"; };

/* ---------- bozza automatica (IndexedDB, solo in questo browser) ---------- */
const IDB={db:null,
  open(){ return new Promise(ok=>{ try{ const r=indexedDB.open("cfhub-editor",1); r.onupgradeneeded=()=>r.result.createObjectStore("kv"); r.onsuccess=()=>{IDB.db=r.result;ok(true)}; r.onerror=()=>ok(false); }catch(e){ok(false)} }); },
  put(k,v){ return new Promise(ok=>{ try{ const t=IDB.db.transaction("kv","readwrite"); t.objectStore("kv").put(v,k); t.oncomplete=()=>ok(true); t.onerror=()=>ok(false);}catch(e){ok(false)} }); },
  get(k){ return new Promise(ok=>{ try{ const q=IDB.db.transaction("kv").objectStore("kv").get(k); q.onsuccess=()=>ok(q.result); q.onerror=()=>ok(null);}catch(e){ok(null)} }); },
};
let _as=null;
App.autosave=function(){ clearTimeout(_as); _as=setTimeout(async()=>{ if(!IDB.db) return; const used=App.usedAssets();
  const ok=await IDB.put("draft",{page:App.snap(),assets:[...ASSETS].filter(([k])=>used.has(k)),at:Date.now()});
  $("#saved").textContent=ok?"Bozza salvata "+new Date().toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"}):""; },800); };
App.usedAssets=function(){ const s=new Set(); walkAll(b=>{ const e=b.__ed||{}; if(e.asset) s.add(e.asset.id); if(e.doc) s.add(e.doc.id); }); return s; };
App.loadDraft=async function(){
  if(!(await IDB.open())) return false; const d=await IDB.get("draft"); if(!d||!d.page) return false;
  const o=JSON.parse(d.page); if(!o.blocks||!o.blocks.length) return false;
  const when=new Date(d.at).toLocaleString("it-IT",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
  const yes=await UIX.confirm("Riprendere la bozza?",`C'è una bozza non esportata: <b>${esc(o.title||"senza titolo")}</b>, salvata il ${when}.`,"Riprendi la bozza","Inizia da zero");
  if(!yes) return false;
  (d.assets||[]).forEach(([k,v])=>ASSETS.set(k,v)); App.setPage(o,true); return true;
};
App.setPage=function(o,keepEd){
  PAGE={id:o.id!=null?String(o.id):"",title:o.title||"",blocks:Array.isArray(o.blocks)?o.blocks:[]};
  SEL=null; TABSEL={}; UNDO.length=0; REDO.length=0; lastSnap=""; App.pushUndo(); App.syncTop(); App.render(); App.props(); App.autosave();
};
App.newPage=async function(){
  if(PAGE.blocks.length&&!(await UIX.confirm("Nuova pagina","La pagina attuale verrà chiusa. Se non l'hai esportata, scarica prima il pacchetto.","Nuova pagina","Annulla"))) return;
  ASSETS.clear(); App.setPage({id:"",title:"Nuova pagina",blocks:[]});
};

/* ---------- avvio ---------- */
App.init=async function(){
  TB.build(); App.palette();
  $("#pTitle").addEventListener("input",e=>{ PAGE.title=e.target.value; $("#appHead").textContent=PAGE.title; App.changed(null,true); });
  $("#pId").addEventListener("input",e=>{ PAGE.id=e.target.value.trim(); App.changed(null,true); });
  $("#canvas").addEventListener("click",e=>{
    const ab=e.target.closest(".bl button[data-act]"); if(ab){ e.stopPropagation(); App.act(ab.closest(".blk").dataset.u,ab.dataset.act); return; }
    const b=e.target.closest(".blk"); if(b) App.select(b.dataset.u);
  });
  $("#stage").addEventListener("click",e=>{ if(e.target.id==="stage") App.deselect(); });
  document.addEventListener("keydown",e=>{
    const inField=e.target.closest&&(e.target.closest(".rt")||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName));
    if((e.ctrlKey||e.metaKey)&&!inField&&e.key.toLowerCase()==="z"){ e.preventDefault(); e.shiftKey?App.redo():App.undo(); }
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="s"){ e.preventDefault(); App.exportPackage(); }
    if(!inField&&SEL&&(e.key==="Delete"||e.key==="Backspace")){ e.preventDefault(); App.act(SEL,"del"); }
    if(e.key==="Escape"&&!$(".mback")) App.deselect();
  });
  $("#fileOpen").addEventListener("change",e=>{ const f=e.target.files[0]; e.target.value=""; if(f) IO.open(f); });
  document.addEventListener("dragover",e=>{ if(e.dataTransfer&&[...e.dataTransfer.types].includes("Files")) e.preventDefault(); });
  document.addEventListener("drop",e=>{ if(e.target.closest(".drop")) return; const f=e.dataTransfer&&e.dataTransfer.files[0]; if(!f) return; e.preventDefault();
    if(/\.(json|zip)$/i.test(f.name)) IO.open(f); else if(/^image\//.test(f.type)&&sel()&&hasImageSlot(sel())) P.setImage(sel(),f); });
  window.addEventListener("beforeunload",()=>{ if(ACTIVE) ACTIVE.save(); });
  try{ await document.fonts.ready; }catch(e){}
  const restored=await App.loadDraft();
  if(!restored){ App.setPage({id:"",title:"Nuova pagina",blocks:[]}); }
};
App.openFile=()=>$("#fileOpen").click();

const UIX={};
UIX.modal=function(title,body,foot,opts={}){
  const bk=h("div","mback"); const m=h("div","modal"+(opts.big?" big":""));
  m.innerHTML=`<div class="mh">${title}<button class="x" title="Chiudi">×</button></div><div class="mb"></div><div class="mf"></div>`;
  if(typeof body==="string") m.querySelector(".mb").innerHTML=body; else m.querySelector(".mb").appendChild(body);
  if(foot) m.querySelector(".mf").innerHTML=foot; else m.querySelector(".mf").remove();
  bk.appendChild(m); document.body.appendChild(bk);
  const close=()=>{ bk.remove(); document.removeEventListener("keydown",kd); opts.onclose&&opts.onclose(); };
  const kd=e=>{ if(e.key==="Escape") close(); };
  document.addEventListener("keydown",kd);
  m.querySelector(".x").onclick=close; bk.addEventListener("mousedown",e=>{ if(e.target===bk) close(); });
  return {el:m,close};
};
UIX.confirm=function(t,msg,yes="OK",no="Annulla"){ return new Promise(ok=>{ let done=false;
  const md=UIX.modal(t,`<div style="line-height:1.5">${msg}</div>`,`<button class="btn" data-r="0">${no}</button><button class="btn pri" data-r="1">${yes}</button>`,{onclose:()=>{if(!done)ok(false)}});
  md.el.querySelector(".mf").addEventListener("click",e=>{ const b=e.target.closest("[data-r]"); if(!b) return; done=true; ok(b.dataset.r==="1"); md.close(); }); }); };
UIX.form=function(title,fields,ctx={}){ return new Promise(ok=>{ let done=false;
  const f=h("div");
  fields.forEach(x=>{ const w=h("div"); w.dataset.k=x.k; if(x.show) w.dataset.show=x.show;
    w.innerHTML=`<label class="fl">${x.l}</label>`+(x.t==="select"?`<select class="sel2">${x.o.map(([v,l])=>`<option value="${esc(v)}"${v==x.v?" selected":""}>${esc(l)}</option>`).join("")}</select>`:`<input class="in" value="${esc(x.v||"")}" placeholder="${esc(x.ph||"")}">`);
    f.appendChild(w); });
  const vis=()=>{ const v=Object.fromEntries(fields.map(x=>[x.k,f.querySelector(`[data-k="${x.k}"] .in,[data-k="${x.k}"] .sel2`).value]));
    $$("[data-show]",f).forEach(w=>{ const s=w.dataset.show; let on=true; if(s[0]==="!") on=!ctx[s.slice(1)]; else { const [k,val]=s.split("="); on=v[k]===val; } w.style.display=on?"":"none"; }); };
  f.addEventListener("change",vis); vis();
  const md=UIX.modal(title,f,`<button class="btn" data-r="0">Annulla</button><button class="btn pri" data-r="1">OK</button>`,{onclose:()=>{if(!done)ok(null)}});
  const go=()=>{ done=true; ok(Object.fromEntries(fields.map(x=>[x.k,f.querySelector(`[data-k="${x.k}"] .in,[data-k="${x.k}"] .sel2`).value]))); md.close(); };
  md.el.querySelector(".mf").addEventListener("click",e=>{ const b=e.target.closest("[data-r]"); if(!b) return; if(b.dataset.r==="1") go(); else { md.close(); } });
  f.addEventListener("keydown",e=>{ if(e.key==="Enter") go(); });
  setTimeout(()=>{ const i=f.querySelector("input,select"); i&&i.focus(); },30); }); };
UIX.pick=function(title,items){ return new Promise(ok=>{ let done=false; const d=h("div"); d.style.cssText="display:flex;flex-wrap:wrap;gap:6px";
  items.forEach(it=>{ const b=h("button","btn",esc(it)); b.style.cssText="min-width:42px;font-size:18px"; b.onclick=()=>{done=true;ok(it);md.close();}; d.appendChild(b); });
  const md=UIX.modal(title,d,null,{onclose:()=>{if(!done)ok(null)}}); }); };

};

    case "sif": { const u=SIF.url(l.cats||[],l.art||PAGE.title); return {kind:"Strumenti in Focus filtrato",href:u,missing:!(l.cats||[]).length,noBase:!/^https?:/.test(u),cats:l.cats}; }

/* ---------- JSON per il backoffice ---------- */
IO.exportJSON=function(){

    if(names.has(o)&&o.type!=="grid_element"&&o.__ed&&(o.__ed.asset||o.__ed.doc)) r._name=names.get(o);
    const e=o.__ed; if(e&&e.asset){ const ho=o.type==="image"?r:(r.image||r.leading); if(ho){ ho.url=PH_URL; delete ho.image_mode; } }

/* ---------- zip (scrittura senza compressione, lettura anche compressa) ---------- */
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
const crc32=u=>{let c=0xFFFFFFFF;for(let i=0;i<u.length;i++)c=CRC[(c^u[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0;};
IO.zip=async function(files){ const enc=new TextEncoder(); const parts=[],cd=[]; let off=0;
  const now=new Date(), dt=((now.getHours()<<11)|(now.getMinutes()<<5)|(now.getSeconds()>>1)), dd=(((now.getFullYear()-1980)<<9)|((now.getMonth()+1)<<5)|now.getDate());
  for(const f of files){ const data=f.data instanceof Uint8Array?f.data:f.data instanceof Blob?new Uint8Array(await f.data.arrayBuffer()):enc.encode(f.data); const name=enc.encode(f.name); const crc=crc32(data);
    const hd=new DataView(new ArrayBuffer(30)); hd.setUint32(0,0x04034b50,true); hd.setUint16(4,20,true); hd.setUint16(6,0x0800,true); hd.setUint16(10,dt,true); hd.setUint16(12,dd,true); hd.setUint32(14,crc,true); hd.setUint32(18,data.length,true); hd.setUint32(22,data.length,true); hd.setUint16(26,name.length,true);
    parts.push(new Uint8Array(hd.buffer),name,data);
    const c=new DataView(new ArrayBuffer(46)); c.setUint32(0,0x02014b50,true); c.setUint16(4,20,true); c.setUint16(6,20,true); c.setUint16(8,0x0800,true); c.setUint16(12,dt,true); c.setUint16(14,dd,true); c.setUint32(16,crc,true); c.setUint32(20,data.length,true); c.setUint32(24,data.length,true); c.setUint16(28,name.length,true); c.setUint32(42,off,true);
    cd.push(new Uint8Array(c.buffer),name); off+=30+name.length+data.length; }
  const cs=cd.reduce((a,b)=>a+b.length,0); const e=new DataView(new ArrayBuffer(22)); e.setUint32(0,0x06054b50,true); e.setUint16(8,files.length,true); e.setUint16(10,files.length,true); e.setUint32(12,cs,true); e.setUint32(16,off,true);
  return new Blob([...parts,...cd,new Uint8Array(e.buffer)],{type:"application/zip"}); };
IO.unzip=async function(buf){ const u8=new Uint8Array(buf), dv=new DataView(buf); let eo=-1;
  for(let i=u8.length-22;i>=Math.max(0,u8.length-70000);i--) if(dv.getUint32(i,true)===0x06054b50){eo=i;break;}
  if(eo<0) throw new Error("zip non valido");
  const n=dv.getUint16(eo+10,true); let p=dv.getUint32(eo+16,true); const out={}; const dec=new TextDecoder();
  for(let k=0;k<n;k++){ const method=dv.getUint16(p+10,true), csize=dv.getUint32(p+20,true), nl=dv.getUint16(p+28,true), xl=dv.getUint16(p+30,true), cl=dv.getUint16(p+32,true), lo=dv.getUint32(p+42,true);
    const name=dec.decode(u8.subarray(p+46,p+46+nl)); p+=46+nl+xl+cl;
    const lnl=dv.getUint16(lo+26,true), lxl=dv.getUint16(lo+28,true); const raw=u8.subarray(lo+30+lnl+lxl,lo+30+lnl+lxl+csize);
    out[name]={method,raw}; }
  const read=async name=>{ const f=out[name]; if(!f) return null; if(f.method===0) return f.raw;
    const ds=new Blob([f.raw]).stream().pipeThrough(new DecompressionStream("deflate-raw")); return new Uint8Array(await new Response(ds).arrayBuffer()); };
  return {names:Object.keys(out),read}; };
IO.download=function(blob,name){ const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),15000); };
const dataToU8=d=>{ const b=atob(d.split(",")[1]); const u=new Uint8Array(b.length); for(let i=0;i<b.length;i++) u[i]=b.charCodeAt(i); return u; };
const u8ToData=(u,mime)=>{ let s=""; for(let i=0;i<u.length;i+=0x8000) s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000)); return "data:"+mime+";base64,"+btoa(s); };

/* ---------- PDF a tutto schermo da un'immagine ---------- */
IO.imagePdf=async function(dataUrl,title){
  const im=await new Promise((ok,ko)=>{ const i=new Image(); i.onload=()=>ok(i); i.onerror=ko; i.src=dataUrl; });
  let w=im.naturalWidth, hh=im.naturalHeight; const maxPx=4000, k=Math.min(1,maxPx/Math.max(w,hh)); w=Math.round(w*k); hh=Math.round(hh*k);
  const c=document.createElement("canvas"); c.width=w; c.height=hh; const x=c.getContext("2d"); x.fillStyle="#fff"; x.fillRect(0,0,w,hh); x.drawImage(im,0,0,w,hh);
  const jpg=dataToU8(c.toDataURL("image/jpeg",.93));
  // pagina con le stesse proporzioni dell'immagine: orizzontale se l'immagine è larga, verticale se è alta
  const L=842, pw=w>=hh?L:Math.round(L*w/hh), ph=w>=hh?Math.round(L*hh/w):L;
  const enc=new TextEncoder(); const chunks=[]; let len=0; const offs=[];
  const add=s=>{ const u=typeof s==="string"?enc.encode(s):s; chunks.push(u); len+=u.length; };
  const obj=(n,body)=>{ offs[n]=len; add(`${n} 0 obj\n`); add(body); add("\nendobj\n"); };
  add("%PDF-1.4\n"); add(new Uint8Array([37,226,227,207,211,10]));
  obj(1,"<< /Type /Catalog /Pages 2 0 R >>");
  obj(2,"<< /Type /Pages /Kids [3 0 R] /Count 1 >>");
  obj(3,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pw} ${ph}] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>`);
  offs[4]=len; add(`4 0 obj\n<< /Type /XObject /Subtype /Image /Width ${w} /Height ${hh} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpg.length} >>\nstream\n`); add(jpg); add("\nendstream\nendobj\n");
  const cs=`q ${pw} 0 0 ${ph} 0 0 cm /Im0 Do Q`; offs[5]=len; add(`5 0 obj\n<< /Length ${cs.length} >>\nstream\n${cs}\nendstream\nendobj\n`);
  const t=(title||"").replace(/[()\\]/g,"").replace(/[^\x20-\x7e]/g,""); obj(6,`<< /Title (${t}) /Producer (Editor pagine CF HUB) >>`);
  const xo=len; let xr=`xref\n0 7\n0000000000 65535 f \n`; for(let n=1;n<=6;n++) xr+=String(offs[n]).padStart(10,"0")+" 00000 n \n";
  add(xr+`trailer\n<< /Size 7 /Root 1 0 R /Info 6 0 R >>\nstartxref\n${xo}\n%%EOF\n`);
  const out=new Uint8Array(len); let p=0; for(const c2 of chunks){ out.set(c2,p); p+=c2.length; } return out;
};

/* ---------- controllo prima dell'esportazione ---------- */
IO.check=function(){
  const order=IO.assetOrder(); const iss=[]; const names=new Map();
  if(!PAGE.blocks.length) iss.push(["La pagina è vuota",""]);
  if(!PAGE.title) iss.push(["Manca il titolo della pagina",""]);
  walkAll(b=>{ const e=b.__ed||{}; const nm=IO.expName(b,order);
    if(hasImageSlot(b)&&!R.imgSrc(b)) iss.push([`Immagine non caricata: <b>${esc(nm||typeLabel(b))}</b>`,"Va caricata nel backoffice; nelle istruzioni la trovi senza file."]);
    const t=hasAction(b)?IO.linkTarget(b,order):null;
    if(t&&t.missing) iss.push([`Collegamento incompleto: <b>${esc(nm||typeLabel(b))}</b>`,t.kind]);
    if(t&&t.noBase) iss.push([`Manca l'indirizzo degli strumenti per <b>${esc(nm||typeLabel(b))}</b>`,"Imposta la cartella dei tool in ⚙ Impostazioni, così il link nelle istruzioni è completo."]);
    if(b._name&&b._name.length>NAME_MAX&&!order.includes(b)) iss.push([`Nome lungo (${b._name.length} caratteri): <b>${esc(b._name)}</b>`,""]);
    if(b.type==="grid_element"){ const k=b._name||""; if(names.has(k)) iss.push([`Due voci della griglia con lo stesso nome: <b>${esc(k)}</b>`,""]); names.set(k,1); }
  });
  return iss;
};

App.exportPackage=async function(){

    const ok=await UIX.confirm("Prima di scaricare",`<ul class="issues">${iss.map(([a,b])=>`<li>${a}${b?`<br><span class="note">${b}</span>`:""}</li>`).join("")}</ul>`,"Scarica comunque","Torna all'editor");
    if(!ok) return; }

IO.buildPackage=async function(){
  const order=IO.assetOrder(); const folder=today()+"_"+IO.slugTitle(); const F=[]; const add=(n,d)=>F.push({name:folder+"/"+n,data:d});
  const json=IO.exportJSON(); add(IO.slugTitle()+".json",JSON.stringify(json));
  const files={}; // asset id -> nome file nel pacchetto
  for(const b of order){ const e=b.__ed||{};
    if(e.asset&&ASSETS.get(e.asset.id)){ const fn=IO.fileFor(b,"img",order); add(fn,dataToU8(ASSETS.get(e.asset.id))); files[e.asset.id]=fn;
      if(e.zoom) add(IO.fileFor(b,"pdf",order),await IO.imagePdf(ASSETS.get(e.asset.id),IO.label(b))); }
    if(e.doc&&ASSETS.get(e.doc.id)){ const fn=IO.fileFor(b,"pdf",order); add(fn,dataToU8(ASSETS.get(e.doc.id))); files[e.doc.id]=fn; } }
  add("ISTRUZIONI.html",IO.instructions(order));
  add("articolo.html",IO.article("files",order));
  add("articolo_copia-incolla.html",IO.article("inline",order));
  add("progetto_editor.json",JSON.stringify({__cfhub_editor:VER,saved:new Date().toISOString(),page:JSON.parse(App.snap()),files}));

};

IO.open=async function(f){
  try{
    if(PAGE.blocks.length&&!(await UIX.confirm("Aprire "+esc(f.name)+"?","La pagina attuale verrà sostituita. Se non l'hai esportata, scarica prima il pacchetto.","Apri","Annulla"))) return;
    if(/\.zip$/i.test(f.name)){
      const z=await IO.unzip(await f.arrayBuffer());
      const pn=z.names.find(n=>/(^|\/)progetto_editor\.json$/.test(n));
      if(pn){ const pr=JSON.parse(new TextDecoder().decode(await z.read(pn))); const dir=pn.replace(/progetto_editor\.json$/,"");
        ASSETS.clear(); for(const [id,fn] of Object.entries(pr.files||{})){ const u=await z.read(dir+fn); if(u) ASSETS.set(id,u8ToData(u,/\.pdf$/i.test(fn)?"application/pdf":"image/"+({jpg:"jpeg",svg:"svg+xml"}[fn.split(".").pop()]||fn.split(".").pop()))); }
        App.setPage(pr.page); return toast("Pacchetto aperto: "+(pr.page.title||"")); }
      const jn=z.names.find(n=>/\.json$/i.test(n)&&!/progetto_editor/.test(n)); if(!jn) throw new Error("nello zip non c'è un JSON di pagina");
      return IO.openJSON(JSON.parse(new TextDecoder().decode(await z.read(jn))),jn);
    }
    IO.openJSON(JSON.parse(await f.text()),f.name);
  }catch(e){ console.error(e); toast("File non leggibile: "+e.message,5000); }
};

};

function regionOf(s){
  if(/^(Global)\b/.test(s))return["global","Global"]; if(/^Europe\b/.test(s))return["europe","Europe"];
  if(/^(US|USA|Usa)\b/.test(s))return["usa","USA"]; if(/^Emerging Markets\b/.test(s))return["emerging","Emerging Markets"];
  if(/^Frontier Markets\b/.test(s))return["frontier","Frontier Markets"]; if(/^Asia\b/.test(s))return["asia","Asia"];

function meta(c){
  let m;
  if(m=/^Azionario Settoriale (.+)$/.exec(c)) return {ic:ICN[m[1]]||ICN.Industrials,col:COL.az,lab:"Azionario Settoriale",name:m[1]};
  if(m=/^Azionario (Global|Usa|Europe|Asia|Emerging Markets|Frontier Markets) ?(.*)$/.exec(c)){
    const base={Global:"global",Usa:"usa",Europe:"europe",Asia:"asia","Emerging Markets":"emerging","Frontier Markets":"frontier"}[m[1]];
    const spec={Italy:"italia",Switzerland:"svizzera",UK:"uk",Japan:"giappone",China:"cina","Latin America":"latam",Africa:"sudafrica"}[m[2]];
    if(ICN[m[2]]) return {ic:ICN[m[2]],col:COL.az,lab:"Azionario Settoriale",name:m[2]};
    return {ic:ICN[spec||base],col:COL.az,lab:"Azionario "+m[1],name:c};
  }
  if(CCY[c]) return {ic:ICN[CCY[c][0]],col:COL.cu,lab:"Valute vs Euro · "+CCY[c][1],name:c.toUpperCase()};
  if(c==="Aggregate") return {ic:ICN.commodities,col:COL.co,lab:"Materie prime",name:"Commodities Aggregate"};
  const r=regionOf(c);
  if(/Flexible Allocation/.test(c)) return {ic:ICN[r[0]],col:COL.bi,lab:"Bilanciati · "+r[1],name:c};
  if(/(Long\/Short|Macro|Market Neutral|Multistrategy|Options Trading|Systematic|Global Currency)/.test(c)) return {ic:ICN[r[0]],col:COL.al,lab:"Alternativi · "+r[1],name:c};

}

  toast("Preparo le immagini…");
  const cvs=await SIF.render(mode,cs);
  const box=Object.assign(T.item_display(),{_name:"strumenti in focus"});
  if(head){ const t=T.text(); t.text='<p><span class="futureStyle-headline5">Strumenti in focus</span></p>'; box.blocks.push(t); }
  const short=c=>SIFIMG.meta(c).name;
  if(mode==="img_cards"||mode==="img_icons"){ const im=T.image(); im._name="strumenti in focus"; ed(im).asset=SIF.asset(cvs[0],"strumenti-in-focus.png"); ed(im).link={type:"sif",cats:cs,art}; box.blocks.push(im); }
  else if(mode==="each_cards"){ cs.forEach((c,i)=>{ const im=T.image(); im._name="sif "+short(c).toLowerCase(); ed(im).asset=SIF.asset(cvs[i],slug(c)+".png"); ed(im).link={type:"sif",cats:[c],art}; box.blocks.push(im); }); }
  else { const g=T.grid_layout(); g.blocks=[]; cs.forEach((c,i)=>{ const el=T.grid_element(); el._name=short(c); ed(el).asset=SIF.asset(cvs[i],slug(c)+".png"); ed(el).link={type:"sif",cats:[c],art}; g.blocks.push(el); }); box.blocks.push(g); }
  App.insert(box,{focus:false}); toast("Strumenti in Focus inserito");
};

/* tutte le varianti di immagine + i link, in uno zip (senza toccare la pagina) */
SIF.downloadAll=async function(cs,art){
  toast("Preparo le immagini…",4000);
  const pre=slug(art||"articolo",40), F=[], links=["Link a Strumenti in Focus","","Tutte le categorie:",SIF.url(cs,art),""];
  const png=cv=>dataToU8(cv.toDataURL("image/png"));
  F.push({name:pre+"/tutte_icone_nomi.png",data:png((await SIF.render("img_cards",cs))[0])});
  F.push({name:pre+"/tutte_icone.png",data:png((await SIF.render("img_icons",cs))[0])});
  const cards=await SIF.render("each_cards",cs), icons=await SIF.render("grid",cs);
  cs.forEach((c,i)=>{ F.push({name:pre+"/singole/"+slug(c,70)+"_icona_nome.png",data:png(cards[i])}); F.push({name:pre+"/singole/"+slug(c,70)+"_icona.png",data:png(icons[i])}); links.push(c+":",SIF.url([c],art),""); });
  F.push({name:pre+"/link.txt",data:links.join("\n")});
  IO.download(await IO.zip(F),pre+"_strumenti-in-focus.zip"); toast("Link e immagini scaricati");
};

App.init();
</script></body></html>
